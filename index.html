<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>OmniCalc Pro - Universal Executive Suite</title>

    <!-- PWA & Mobile Web Capabilities -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="OmniCalc">
    <meta name="theme-color" content="#06080F">
    <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22OmniCalc%20Pro%22%2C%22short_name%22%3A%22OmniCalc%22%2C%22start_url%22%3A%22%2F%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%2306080F%22%2C%22theme_color%22%3A%22%236366f1%22%7D">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        obsidian: '#07090e',
                        surface: 'rgba(18, 22, 34, 0.75)',
                        surfaceBorder: 'rgba(255, 255, 255, 0.08)',
                        brand: {
                            500: '#6366f1',
                            600: '#4f46e5',
                            accent: '#06b6d4'
                        }
                    }
                }
            }
        }
    </script>

    <!-- React 18 & Dependencies -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap');
        
        * {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            touch-action: manipulation;
            background-color: #06080f;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.12) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(15, 23, 42, 0.8) 0px, transparent 100%);
            background-attachment: fixed;
            min-height: 100vh;
            min-height: -webkit-fill-available;
        }

        .font-mono {
            font-family: 'JetBrains Mono', monospace;
            font-feature-settings: "tnum" 1, "zero" 1;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .glass-panel {
            background: rgba(15, 20, 32, 0.72);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-card {
            background: rgba(22, 28, 45, 0.55);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.07);
        }

        .btn-touch {
            transition: all 0.12s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-touch:active {
            transform: scale(0.94);
            filter: brightness(1.2);
        }
    </style>
</head>
<body class="text-slate-100 antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Indian Currency Formatter (₹ - Lakhs/Crores)
        const formatINR = (val) => {
            const num = parseFloat(val);
            if (isNaN(num)) return '₹0.00';
            return '₹' + num.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        };

        // Haptic feedback trigger (Android & modern touch devices)
        const triggerHaptic = () => {
            if (typeof window !== 'undefined' && window.navigator && window.navigator.vibrate) {
                window.navigator.vibrate(10);
            }
        };

        const CONVERSION_RATES = {
            length: { m: 1, cm: 0.01, mm: 0.001, km: 1000, in: 0.0254, ft: 0.3048, yd: 0.9144, mi: 1609.344 },
            mass: { kg: 1, g: 0.001, mg: 0.000001, lb: 0.453592, oz: 0.02835, ton: 1000 },
            volume: { l: 1, ml: 0.001, gal: 3.78541, qt: 0.94635, cup: 0.24, floz: 0.02957 },
            area: { sqm: 1, sqft: 0.0929, sqin: 0.000645, acre: 4046.86, hectare: 10000 },
            temperature: { c: 'C', f: 'F', k: 'K' },
            speed: { kmh: 1, mps: 3.6, mph: 1.60934, knot: 1.852 },
            digital: { b: 1, kb: 1024, mb: 1048576, gb: 1073741824, tb: 1099511627776 }
        };

        function App() {
            const [activeTab, setActiveTab] = useState('calc');
            const [calcMode, setCalcMode] = useState('standard');

            // --- CALCULATOR STATE ---
            const [display, setDisplay] = useState('0');
            const [expression, setExpression] = useState('');
            const [memory, setMemory] = useState(0);
            const [history, setHistory] = useState([]);
            const [showHistory, setShowHistory] = useState(false);
            const [isRad, setIsRad] = useState(false);

            // --- CONVERTER STATE ---
            const [convCat, setConvCat] = useState('length');
            const [convFrom, setConvFrom] = useState('m');
            const [convTo, setConvTo] = useState('ft');
            const [convVal, setConvVal] = useState('1');

            // --- AR / CAMERA MEASURE STATE ---
            const [capturedImage, setCapturedImage] = useState(null);
            const [calibMode, setCalibMode] = useState('room_15ft');
            const [points, setPoints] = useState([]);
            const [measResult, setMeasResult] = useState(null);
            const [cameraActive, setCameraActive] = useState(false);

            // --- FINANCE STATE (INR) ---
            const [finTab, setFinTab] = useState('loan');
            const [loanPrincipal, setLoanPrincipal] = useState('2500000');
            const [loanInterest, setLoanInterest] = useState('8.5');
            const [loanYears, setLoanYears] = useState('20');
            const [invInit, setInvInit] = useState('50000');
            const [invAnnual, setInvAnnual] = useState('12');
            const [invYears, setInvYears] = useState('15');
            const [invMonthly, setInvMonthly] = useState('5000');
            const [gstBase, setGstBase] = useState('10000');
            const [gstRate, setGstRate] = useState('18');
            const [gstType, setGstType] = useState('exclusive'); // exclusive (add GST) or inclusive (extract GST)

            // --- HEALTH SUITE STATE ---
            const [userHeight, setUserHeight] = useState('175'); // cm
            const [userWeight, setUserWeight] = useState('72');  // kg
            const [userAge, setUserAge] = useState('26');
            const [userGender, setUserGender] = useState('male');

            // --- DATE STATE ---
            const [dob, setDob] = useState('1998-05-15');
            const [cmpDate, setCmpDate] = useState(new Date().toISOString().split('T')[0]);

            const fileRef = useRef(null);
            const canvasRef = useRef(null);
            const videoRef = useRef(null);

            // Keyboard navigation (Windows / Mac / Desktop)
            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (activeTab !== 'calc') return;
                    if ((e.key >= '0' && e.key <= '9') || e.key === '.') handleCalc(e.key);
                    else if (e.key === '+') handleCalc('+');
                    else if (e.key === '-') handleCalc('-');
                    else if (e.key === '*') handleCalc('×');
                    else if (e.key === '/') handleCalc('÷');
                    else if (e.key === 'Enter' || e.key === '=') handleCalc('=');
                    else if (e.key === 'Backspace') handleCalc('⌫');
                    else if (e.key === 'Escape') handleCalc('C');
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            });

            // Robust math evaluator
            const handleCalc = (btn) => {
                triggerHaptic();
                if (btn === 'C') {
                    setDisplay('0');
                    setExpression('');
                } else if (btn === 'CE') {
                    setDisplay('0');
                } else if (btn === '⌫') {
                    setDisplay(prev => (prev.length > 1 ? prev.slice(0, -1) : '0'));
                } else if (btn === '±') {
                    setDisplay(prev => (prev.startsWith('-') ? prev.slice(1) : '-' + prev));
                } else if (['+', '-', '×', '÷'].includes(btn)) {
                    setExpression(expression ? `${expression} ${display} ${btn}` : `${display} ${btn}`);
                    setDisplay('0');
                } else if (btn === '=') {
                    try {
                        let fullExp = (expression ? `${expression} ${display}` : display)
                            .replace(/×/g, '*')
                            .replace(/÷/g, '/')
                            .replace(/π/g, `${Math.PI}`)
                            .replace(/e/g, `${Math.E}`);

                        if (!/^[\d\s+\-*/.()MathPIE]+$/.test(fullExp)) throw new Error('Invalid');
                        const calcRes = Function(`"use strict"; return (${fullExp})`)();
                        const sanitized = Number.isFinite(calcRes) ? parseFloat(calcRes.toFixed(8)).toString() : 'Error';
                        setHistory(prev => [{ exp: `${expression} ${display}`, res: sanitized }, ...prev.slice(0, 19)]);
                        setDisplay(sanitized);
                        setExpression('');
                    } catch {
                        setDisplay('Error');
                    }
                } else {
                    if (display === '0' && btn !== '.') setDisplay(btn);
                    else if (btn === '.' && display.includes('.')) return;
                    else setDisplay(prev => prev + btn);
                }
            };

            const handleScientific = (op) => {
                triggerHaptic();
                try {
                    let v = parseFloat(display);
                    let res = 0;
                    if (op === 'sin') res = Math.sin(isRad ? v : (v * Math.PI) / 180);
                    if (op === 'cos') res = Math.cos(isRad ? v : (v * Math.PI) / 180);
                    if (op === 'tan') res = Math.tan(isRad ? v : (v * Math.PI) / 180);
                    if (op === 'log') res = Math.log10(v);
                    if (op === 'ln') res = Math.log(v);
                    if (op === 'sqrt') res = Math.sqrt(v);
                    if (op === 'sqr') res = Math.pow(v, 2);
                    if (op === 'cube') res = Math.pow(v, 3);
                    if (op === 'inv') res = 1 / v;
                    if (op === 'fact') {
                        if (v < 0 || v > 150) throw new Error('Range');
                        let f = 1;
                        for (let i = 2; i <= Math.floor(v); i++) f *= i;
                        res = f;
                    }
                    const finalRes = parseFloat(res.toFixed(8)).toString();
                    setHistory(prev => [{ exp: `${op}(${display})`, res: finalRes }, ...prev.slice(0, 19)]);
                    setDisplay(finalRes);
                } catch {
                    setDisplay('Error');
                }
            };

            // Memory Operations
            const handleMemory = (action) => {
                triggerHaptic();
                const current = parseFloat(display) || 0;
                if (action === 'MC') setMemory(0);
                if (action === 'MR') setDisplay(memory.toString());
                if (action === 'M+') setMemory(prev => prev + current);
                if (action === 'M-') setMemory(prev => prev - current);
            };

            // Conversions Engine
            useEffect(() => {
                const units = Object.keys(CONVERSION_RATES[convCat]);
                setConvFrom(units[0]);
                setConvTo(units[1] || units[0]);
            }, [convCat]);

            const runConversion = () => {
                const val = parseFloat(convVal);
                if (isNaN(val)) return '0';
                if (convCat === 'temperature') {
                    if (convFrom === convTo) return val;
                    let c = val;
                    if (convFrom === 'f') c = (val - 32) * (5 / 9);
                    if (convFrom === 'k') c = val - 273.15;
                    let target = c;
                    if (convTo === 'f') target = (c * 9) / 5 + 32;
                    if (convTo === 'k') target = c + 273.15;
                    return parseFloat(target.toFixed(4));
                }
                const catMap = CONVERSION_RATES[convCat];
                if (!catMap) return '0';
                return parseFloat(((val * catMap[convFrom]) / catMap[convTo]).toFixed(6));
            };

            // AR Camera Handlers
            const startCamera = async () => {
                try {
                    setCapturedImage(null); setPoints([]); setMeasResult(null); setCameraActive(true);
                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }
                    });
                    if (videoRef.current) videoRef.current.srcObject = stream;
                } catch {
                    alert('Camera access denied or unavailable. You can upload an image instead.');
                    setCameraActive(false);
                }
            };

            const takeSnapshot = () => {
                triggerHaptic();
                if (!videoRef.current) return;
                const vid = videoRef.current;
                const canvas = document.createElement('canvas');
                canvas.width = vid.videoWidth || 1280;
                canvas.height = vid.videoHeight || 720;
                canvas.getContext('2d').drawImage(vid, 0, 0, canvas.width, canvas.height);
                setCapturedImage(canvas.toDataURL('image/jpeg'));
                if (vid.srcObject) {
                    vid.srcObject.getTracks().forEach(t => t.stop());
                }
                setCameraActive(false);
            };

            const handleFileImage = (e) => {
                const f = e.target.files[0];
                if (f) {
                    const reader = new FileReader();
                    reader.onload = ev => {
                        setCapturedImage(ev.target.result);
                        setPoints([]);
                        setMeasResult(null);
                        setCameraActive(false);
                    };
                    reader.readAsDataURL(f);
                }
            };

            // Retina/HiDPI Responsive Canvas Draw
            useEffect(() => {
                if (!capturedImage || !canvasRef.current) return;
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const img = new Image();
                img.onload = () => {
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);
                    if (points.length === 2) {
                        ctx.beginPath();
                        ctx.moveTo(points[0].x, points[0].y);
                        ctx.lineTo(points[1].x, points[1].y);
                        ctx.strokeStyle = '#06b6d4';
                        ctx.lineWidth = Math.max(4, canvas.width / 140);
                        ctx.shadowColor = 'rgba(6, 182, 212, 0.6)';
                        ctx.shadowBlur = 10;
                        ctx.stroke();
                        ctx.shadowBlur = 0;
                    }
                    points.forEach((pt, i) => {
                        ctx.fillStyle = i === 0 ? '#10b981' : '#f43f5e';
                        ctx.beginPath();
                        ctx.arc(pt.x, pt.y, Math.max(9, canvas.width / 75), 0, Math.PI * 2);
                        ctx.fill();
                        ctx.strokeStyle = '#ffffff';
                        ctx.lineWidth = Math.max(2.5, canvas.width / 220);
                        ctx.stroke();
                    });
                };
                img.src = capturedImage;
            }, [capturedImage, points]);

            const onCanvasClick = (e) => {
                triggerHaptic();
                if (!capturedImage) return;
                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                const sx = canvas.width / rect.width;
                const sy = canvas.height / rect.height;
                const x = (e.clientX - rect.left) * sx;
                const y = (e.clientY - rect.top) * sy;

                let next = [...points, { x, y }];
                if (next.length > 2) next = [{ x, y }];
                setPoints(next);

                if (next.length === 2) {
                    const pixelDist = Math.hypot(next[1].x - next[0].x, next[1].y - next[0].y);
                    const scopes = { card_3in: 0.28, desk_4ft: 4.0, room_15ft: 15.0, room_20ft: 20.0, field_60ft: 60.0 };
                    const feetPerPixel = (scopes[calibMode] || 15.0) / Math.hypot(canvas.width, canvas.height);
                    const lenFt = pixelDist * feetPerPixel;
                    const lenM = lenFt * 0.3048;
                    const estAreaSqFt = lenFt * (lenFt * 0.7);
                    setMeasResult({
                        ft: lenFt.toFixed(2),
                        in: (lenFt * 12).toFixed(1),
                        m: lenM.toFixed(2),
                        cm: (lenM * 100).toFixed(1),
                        sqFt: estAreaSqFt.toFixed(2),
                        sqM: (estAreaSqFt * 0.092903).toFixed(2)
                    });
                }
            };

            // Health Suite Computations
            const computeHealth = () => {
                const hMeters = parseFloat(userHeight) / 100;
                const wKg = parseFloat(userWeight);
                if (!hMeters || !wKg) return null;

                const bmi = wKg / (hMeters * hMeters);
                let cat = 'Normal Weight';
                let col = 'text-emerald-400';
                if (bmi < 18.5) { cat = 'Underweight'; col = 'text-amber-400'; }
                else if (bmi >= 25 && bmi < 29.9) { cat = 'Overweight'; col = 'text-amber-400'; }
                else if (bmi >= 30) { cat = 'Obesity'; col = 'text-rose-400'; }

                // Harris-Benedict BMR Formula
                const age = parseFloat(userAge) || 25;
                let bmr = userGender === 'male'
                    ? 88.362 + (13.397 * wKg) + (4.799 * parseFloat(userHeight)) - (5.677 * age)
                    : 447.593 + (9.247 * wKg) + (3.098 * parseFloat(userHeight)) - (4.330 * age);

                // Devine Ideal Body Weight Formula
                const hInches = parseFloat(userHeight) / 2.54;
                const over5Ft = Math.max(0, hInches - 60);
                const idealWeight = userGender === 'male' ? 50 + 2.3 * over5Ft : 45.5 + 2.3 * over5Ft;

                return {
                    bmi: bmi.toFixed(1),
                    category: cat,
                    color: col,
                    bmr: Math.round(bmr),
                    ideal: idealWeight.toFixed(1),
                    water: (wKg * 0.035).toFixed(1) // Liters daily
                };
            };
            const health = computeHealth();

            // Date Computations
            const calculateAge = () => {
                const start = new Date(dob);
                const end = new Date(cmpDate);
                if (isNaN(start) || isNaN(end) || end < start) return null;
                let y = end.getFullYear() - start.getFullYear();
                let m = end.getMonth() - start.getMonth();
                let d = end.getDate() - start.getDate();
                if (d < 0) { m--; d += new Date(end.getFullYear(), end.getMonth(), 0).getDate(); }
                if (m < 0) { y--; m += 12; }
                const totalDays = Math.floor((end - start) / (1000 * 60 * 60 * 24));
                let nextBday = new Date(end.getFullYear(), start.getMonth(), start.getDate());
                if (nextBday < end) nextBday = new Date(end.getFullYear() + 1, start.getMonth(), start.getDate());
                return {
                    y, m, d,
                    totalDays,
                    totalWeeks: Math.floor(totalDays / 7),
                    totalHours: totalDays * 24,
                    daysToBday: Math.ceil((nextBday - end) / (1000 * 60 * 60 * 24))
                };
            };
            const age = calculateAge();

            return (
                <div className="flex flex-col h-screen max-w-md mx-auto bg-obsidian text-slate-100 shadow-[0_0_80px_rgba(0,0,0,0.8)] overflow-hidden border-x border-surfaceBorder select-none">
                    {/* Header with Safe Area Support for iOS notch/dynamic island */}
                    <header className="pt-[env(safe-area-inset-top)] px-4 py-3 bg-slate-950/80 backdrop-blur-xl border-b border-surfaceBorder z-30 shrink-0 flex items-center justify-between">
                        <div className="flex items-center space-x-2.5">
                            <div className="w-8 h-8 rounded-xl bg-gradient-to-tr from-brand-600 via-indigo-500 to-brand-accent flex items-center justify-center font-bold text-white shadow-[0_0_16px_rgba(99,102,241,0.4)]">
                                <i className="fa-solid fa-shapes text-sm"></i>
                            </div>
                            <div>
                                <h1 className="font-extrabold text-base tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">
                                    OmniCalc Pro
                                </h1>
                                <span className="text-[10px] text-cyan-400 font-semibold tracking-wider block uppercase">Executive Suite • ₹ INR</span>
                            </div>
                        </div>

                        <div className="flex items-center space-x-2">
                            {activeTab === 'calc' && (
                                <button
                                    onClick={() => { triggerHaptic(); setShowHistory(!showHistory); }}
                                    className={`p-2 rounded-xl text-xs transition btn-touch ${showHistory ? 'bg-indigo-600 text-white shadow-lg' : 'bg-white/5 text-slate-400 hover:text-white'}`}
                                >
                                    <i className="fa-solid fa-clock-rotate-left"></i>
                                </button>
                            )}
                            <div className="text-[10px] px-2 py-0.5 rounded-full bg-indigo-500/10 text-indigo-400 font-mono font-medium border border-indigo-500/20">
                                v4.2
                            </div>
                        </div>
                    </header>

                    {/* Scroll Area */}
                    <main className="flex-1 overflow-y-auto no-scrollbar p-4 pb-28 space-y-4">
                        {/* ===================================== */}
                        {/* 1. CALCULATOR */}
                        {/* ===================================== */}
                        {activeTab === 'calc' && (
                            <div className="flex flex-col h-full justify-between space-y-3">
                                <div className="flex justify-between items-center">
                                    <div className="flex space-x-1 glass-card p-1 rounded-xl text-xs">
                                        <button
                                            onClick={() => { triggerHaptic(); setCalcMode('standard'); }}
                                            className={`px-3 py-1.5 rounded-lg transition font-medium ${calcMode === 'standard' ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/30' : 'text-slate-400'}`}
                                        >
                                            Standard
                                        </button>
                                        <button
                                            onClick={() => { triggerHaptic(); setCalcMode('scientific'); }}
                                            className={`px-3 py-1.5 rounded-lg transition font-medium ${calcMode === 'scientific' ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/30' : 'text-slate-400'}`}
                                        >
                                            Scientific
                                        </button>
                                    </div>
                                    <div className="flex items-center space-x-1.5">
                                        {calcMode === 'scientific' && (
                                            <button
                                                onClick={() => { triggerHaptic(); setIsRad(!isRad); }}
                                                className="text-[11px] px-2.5 py-1.5 rounded-lg bg-white/5 text-indigo-400 font-mono font-semibold border border-white/10 btn-touch"
                                            >
                                                {isRad ? 'RAD' : 'DEG'}
                                            </button>
                                        )}
                                        {memory !== 0 && (
                                            <span className="text-[10px] px-2 py-1 bg-amber-500/10 text-amber-400 rounded-lg border border-amber-500/20 font-mono">
                                                M={memory}
                                            </span>
                                        )}
                                    </div>
                                </div>

                                {/* LCD Screen */}
                                <div className="glass-panel p-4 rounded-3xl border border-white/10 shadow-[inset_0_2px_12px_rgba(0,0,0,0.6)] text-right min-h-[115px] flex flex-col justify-end">
                                    <div className="text-xs text-slate-500 font-mono tracking-wider overflow-x-auto whitespace-nowrap">
                                        {expression || '\u00A0'}
                                    </div>
                                    <div className="text-4xl font-mono font-bold text-white mt-1 tracking-tight overflow-x-auto whitespace-nowrap">
                                        {display}
                                    </div>
                                </div>

                                {/* Memory Strip */}
                                <div className="grid grid-cols-4 gap-1.5 text-xs font-mono font-semibold">
                                    {['MC', 'MR', 'M+', 'M-'].map(m => (
                                        <button
                                            key={m}
                                            onClick={() => handleMemory(m)}
                                            className="py-1.5 glass-card hover:bg-white/10 text-slate-400 hover:text-indigo-300 rounded-xl transition btn-touch"
                                        >
                                            {m}
                                        </button>
                                    ))}
                                </div>

                                                let finalAmt = 0;
                                                if (gstType === 'exclusive') {
                                                    taxAmt = (amt * rate) / 100;
                                                    finalAmt = amt + taxAmt;
                                                } else {
                                                    taxAmt = amt - (amt * (100 / (100 + rate)));
                                                    finalAmt = amt;
                                                }
                                                return (
                                                    <>
                                                        <div className="flex justify-between text-xs text-slate-300">
                                                            <span>Total GST Amount:</span>
                                                            <strong className="text-cyan-300 font-mono">{formatINR(taxAmt)}</strong>
                                                        </div>
                                                        <div className="flex justify-between text-xs text-slate-400">
                                                            <span>CGST ({rate/2}%) + SGST ({rate/2}%):</span>
                                                            <span className="font-mono">{formatINR(taxAmt / 2)} each</span>
                                                        </div>
                                                        <div className="flex justify-between text-sm text-white pt-2 border-t border-white/10 font-bold">
                                                            <span>Net Total:</span>
                                                            <span className="font-mono text-emerald-400">{formatINR(finalAmt)}</span>
                                                        </div>
                                                    </>
                                                );
                                            })()}
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* ===================================== */}
                        {/* 5. HEALTH & FITNESS */}
                        {/* ===================================== */}
                        {activeTab === 'health' && (
                            <div className="space-y-4">
                                <div className="glass-panel p-4 rounded-3xl border border-white/10 space-y-3.5">
                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="text-xs text-slate-400 font-medium">Height (cm)</label>
                                            <input
                                                type="number"
                                                value={userHeight}
                                                onChange={e => setUserHeight(e.target.value)}
                                                className="w-full mt-1 bg-slate-950/80 border border-white/10 rounded-2xl p-2.5 text-sm font-mono text-white"
                                            />
                                        </div>
                                        <div>
                                            <label className="text-xs text-slate-400 font-medium">Weight (kg)</label>
                                            <input
                                                type="number"
                                                value={userWeight}
                                                onChange={e => setUserWeight(e.target.value)}
                                                className="w-full mt-1 bg-slate-950/80 border border-white/10 rounded-2xl p-2.5 text-sm font-mono text-white"
                                            />
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="text-xs text-slate-400 font-medium">Age</label>
                                            <input
                                                type="number"
                                                value={userAge}
                                                onChange={e => setUserAge(e.target.value)}
                                                className="w-full mt-1 bg-slate-950/80 border border-white/10 rounded-2xl p-2.5 text-sm font-mono text-white"
                                            />
                                        </div>
                                        <div>
                                            <label className="text-xs text-slate-400 font-medium">Gender</label>
                                            <select
                                                value={userGender}
                                                onChange={e => setUserGender(e.target.value)}
                                                className="w-full mt-1 bg-slate-950/80 border border-white/10 rounded-2xl p-2.5 text-sm text-cyan-300 font-semibold"
                                            >
                                                <option value="male">Male</option>
                                                <option value="female">Female</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>

                                {health && (
                                    <div className="space-y-3">
                                        <div className="glass-panel p-4 rounded-3xl border border-white/10 flex items-center justify-between">
                                            <div>
                                                <div className="text-xs text-slate-400 font-medium">Body Mass Index (BMI)</div>
                                                <div className="text-3xl font-extrabold font-mono text-white mt-0.5">{health.bmi}</div>
                                                <div className={`text-xs font-semibold mt-1 ${health.color}`}>{health.category}</div>
                                            </div>
                                            <div className="w-14 h-14 rounded-2xl bg-indigo-500/10 flex items-center justify-center text-cyan-400 text-2xl">
                                                <i className="fa-solid fa-heart-pulse"></i>
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-3 gap-2">
                                            <div className="glass-card p-3 rounded-2xl text-center">
                                                <div className="text-[10px] text-slate-400 font-medium">Daily BMR</div>
                                                <div className="text-base font-bold font-mono text-white mt-1">{health.bmr}</div>
                                                <span className="text-[9px] text-slate-500">kcal/day</span>
                                            </div>
                                            <div className="glass-card p-3 rounded-2xl text-center">
                                                <div className="text-[10px] text-slate-400 font-medium">Ideal Weight</div>
                                                <div className="text-base font-bold font-mono text-white mt-1">{health.ideal}</div>
                                                <span className="text-[9px] text-slate-500">kg</span>
                                            </div>
                                            <div className="glass-card p-3 rounded-2xl text-center">
                                                <div className="text-[10px] text-slate-400 font-medium">Water Goal</div>
                                                <div className="text-base font-bold font-mono text-cyan-400 mt-1">{health.water}</div>
                                                <span className="text-[9px] text-slate-500">Liters</span>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* ===================================== */}
                        {/* 6. CHRONOLOGICAL AGE */}
                        {/* ===================================== */}
                        {activeTab === 'date' && (
                            <div className="space-y-4">
                                <div className="glass-panel p-4 rounded-3xl border border-white/10 space-y-3">
                                    <div>
                                        <label className="text-xs text-slate-400 font-medium">Date of Birth</label>
                                        <input
                                            type="date"
                                            value={dob}
                                            onChange={e => setDob(e.target.value)}
                                            className="w-full mt-1 bg-slate-950/80 border border-white/10 rounded-2xl p-2.5 text-sm text-white"
                                        />
                                    </div>
                                    <div>
                                        <label className="text-xs text-slate-400 font-medium">Evaluation Date</label>
                                        <input
                                            type="date"
                                            value={cmpDate}
                                            onChange={e => setCmpDate(e.target.value)}
                                            className="w-full mt-1 bg-slate-950/80 border border-white/10 rounded-2xl p-2.5 text-sm text-white"
                                        />
                                    </div>
                                </div>

                                {age && (
                                    <div className="space-y-3">
                                        <div className="glass-panel p-4 rounded-3xl border border-indigo-500/20">
                                            <div className="text-[11px] font-semibold text-cyan-400 uppercase tracking-widest">Chronological Age</div>
                                            <div className="text-2xl font-bold text-white mt-1">
                                                {age.y} <span className="text-sm font-normal text-slate-400">years</span> {age.m} <span className="text-sm font-normal text-slate-400">months</span> {age.d} <span className="text-sm font-normal text-slate-400">days</span>
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-3 gap-2 text-center">
                                            <div className="glass-card p-3 rounded-2xl">
                                                <div className="text-[10px] text-slate-400 font-medium">Weeks</div>
                                                <div className="text-base font-bold font-mono text-white mt-0.5">{age.totalWeeks.toLocaleString()}</div>
                                            </div>
                                            <div className="glass-card p-3 rounded-2xl">
                                                <div className="text-[10px] text-slate-400 font-medium">Total Days</div>
                                                <div className="text-base font-bold font-mono text-white mt-0.5">{age.totalDays.toLocaleString()}</div>
                                            </div>
                                            <div className="glass-card p-3 rounded-2xl">
                                                <div className="text-[10px] text-slate-400 font-medium">Next B'day</div>
                                                <div className="text-base font-bold font-mono text-cyan-400 mt-0.5">{age.daysToBday}d</div>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    {/* Navigation Bar with Safe Area Support for Apple Home Bar */}
                    <nav className="fixed bottom-0 w-full max-w-md bg-slate-950/90 backdrop-blur-2xl border-t border-surfaceBorder px-2 pt-2 pb-[calc(0.5rem+env(safe-area-inset-bottom))] z-40 flex justify-between items-center">
                        {[
                            { id: 'calc', label: 'Calc', icon: 'calculator' },
                            { id: 'converter', label: 'Convert', icon: 'arrow-right-arrow-left' },
                            { id: 'measure', label: 'Measure', icon: 'ruler-combined' },
                            { id: 'finance', label: 'Finance', icon: 'indian-rupee-sign' },
                            { id: 'health', label: 'Health', icon: 'heart-pulse' },
                            { id: 'date', label: 'Age', icon: 'calendar-day' }
                        ].map(tab => (
                            <button
                                key={tab.id}
                                onClick={() => { triggerHaptic(); setActiveTab(tab.id); }}
                                className={`flex flex-col items-center justify-center py-1 px-2.5 rounded-xl transition btn-touch ${
                                    activeTab === tab.id ? 'text-cyan-400 font-bold' : 'text-slate-500 hover:text-slate-300'
                                }`}
                            >
                                <i className={`fa-solid fa-${tab.icon} text-base mb-1 ${activeTab === tab.id ? 'drop-shadow-[0_0_8px_rgba(6,182,212,0.6)]' : ''}`}></i>
                                <span className="text-[9px] tracking-tight">{tab.label}</span>
                            </button>
                        ))}
                    </nav>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
