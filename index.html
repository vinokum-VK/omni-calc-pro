<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>OmniCalc Pro - Minimalist Edition</title>

    <!-- Mobile App Capabilities -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#f1f3f6">
    <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22OmniCalc%20Pro%22%2C%22short_name%22%3A%22OmniCalc%22%2C%22start_url%22%3A%22%2F%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23f1f3f6%22%2C%22theme_color%22%3A%22%23f97316%22%7D">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Dependencies -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap');
        
        * {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f1f3f6;
            touch-action: manipulation;
            min-height: 100vh;
            min-height: -webkit-fill-available;
        }

        .font-mono {
            font-family: 'JetBrains Mono', monospace;
            font-feature-settings: "tnum" 1, "zero" 1;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Tactile circle button animation */
        .btn-circle {
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 9999px;
            transition: all 0.12s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-circle:active {
            transform: scale(0.92);
            filter: brightness(0.94);
        }
    </style>
</head>
<body class="text-slate-800 antialiased selection:bg-orange-500 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const formatINR = (val) => {
            const num = parseFloat(val);
            if (isNaN(num)) return '₹0.00';
            return '₹' + num.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        };

        const triggerHaptic = () => {
            if (typeof window !== 'undefined' && window.navigator && window.navigator.vibrate) {
                window.navigator.vibrate(10);
            }
        };

        const CONVERSION_RATES = {
            length: { m: 1, cm: 0.01, mm: 0.001, km: 1000, in: 0.0254, ft: 0.3048, yd: 0.9144, mi: 1609.344 },
            mass: { kg: 1, g: 0.001, mg: 0.000001, lb: 0.453592, oz: 0.02835, ton: 1000 },
            volume: { l: 1, ml: 0.001, gal: 3.78541, qt: 0.94635, cup: 0.24, floz: 0.02957 },
            area: { sqm: 1, sqft: 0.0929, sqin: 0.000645, acre: 4046.86, hectare: 10000 },
            temperature: { c: 'C', f: 'F', k: 'K' },
            speed: { kmh: 1, mps: 3.6, mph: 1.60934, knot: 1.852 },
            digital: { b: 1, kb: 1024, mb: 1048576, gb: 1073741824, tb: 1099511627776 }
        };

        function App() {
            const [activeTab, setActiveTab] = useState('calc');
            const [calcMode, setCalcMode] = useState('standard');

            // --- CALCULATOR STATE ---
            const [display, setDisplay] = useState('0');
            const [expression, setExpression] = useState('');
            const [history, setHistory] = useState([]);
            const [showHistory, setShowHistory] = useState(false);
            const [isRad, setIsRad] = useState(false);

            // --- CONVERTER STATE ---
            const [convCat, setConvCat] = useState('length');
            const [convFrom, setConvFrom] = useState('m');
            const [convTo, setConvTo] = useState('ft');
            const [convVal, setConvVal] = useState('1');

            // --- MEASUREMENT STATE ---
            const [capturedImage, setCapturedImage] = useState(null);
            const [calibMode, setCalibMode] = useState('room_15ft');
            const [points, setPoints] = useState([]);
            const [measResult, setMeasResult] = useState(null);
            const [cameraActive, setCameraActive] = useState(false);

            // --- FINANCE STATE (INR) ---
            const [finTab, setFinTab] = useState('loan');
            const [loanPrincipal, setLoanPrincipal] = useState('2500000');
            const [loanInterest, setLoanInterest] = useState('8.5');
            const [loanYears, setLoanYears] = useState('20');
            const [invInit, setInvInit] = useState('50000');
            const [invAnnual, setInvAnnual] = useState('12');
            const [invYears, setInvYears] = useState('15');
            const [invMonthly, setInvMonthly] = useState('5000');
            const [gstBase, setGstBase] = useState('10000');
            const [gstRate, setGstRate] = useState('18');
            const [gstType, setGstType] = useState('exclusive');

            // --- HEALTH STATE ---
            const [userHeight, setUserHeight] = useState('175');
            const [userWeight, setUserWeight] = useState('72');
            const [userAge, setUserAge] = useState('26');
            const [userGender, setUserGender] = useState('male');

            // --- DATE STATE ---
            const [dob, setDob] = useState('1998-05-15');
            const [cmpDate, setCmpDate] = useState(new Date().toISOString().split('T')[0]);

            const fileRef = useRef(null);
            const canvasRef = useRef(null);
            const videoRef = useRef(null);

            // Keyboard listeners
            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (activeTab !== 'calc') return;
                    if ((e.key >= '0' && e.key <= '9') || e.key === '.') handleCalc(e.key);
                    else if (e.key === '+') handleCalc('+');
                    else if (e.key === '-') handleCalc('-');
                    else if (e.key === '*') handleCalc('×');
                    else if (e.key === '/') handleCalc('÷');
                    else if (e.key === '%') handleCalc('%');
                    else if (e.key === 'Enter' || e.key === '=') handleCalc('=');
                    else if (e.key === 'Backspace') handleCalc('⌫');
                    else if (e.key === 'Escape') handleCalc('AC');
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            });

            const handleCalc = (btn) => {
                triggerHaptic();
                if (btn === 'AC') {
                    setDisplay('0');
                    setExpression('');
                } else if (btn === '⌫') {
                    setDisplay(prev => (prev.length > 1 ? prev.slice(0, -1) : '0'));
                } else if (btn === '%') {
                    const current = parseFloat(display) || 0;
                    setDisplay(String(current / 100));
                } else if (['+', '-', '×', '÷'].includes(btn)) {
                    setExpression(expression ? `${expression} ${display} ${btn}` : `${display} ${btn}`);
                    setDisplay('0');
                } else if (btn === '=') {
                    try {
                        let fullExp = (expression ? `${expression} ${display}` : display)
                            .replace(/×/g, '*')
                            .replace(/÷/g, '/')
                            .replace(/π/g, `${Math.PI}`)
                            .replace(/e/g, `${Math.E}`);

                        if (!/^[\d\s+\-*/.()MathPIE]+$/.test(fullExp)) throw new Error('Invalid');
                        const calcRes = Function(`"use strict"; return (${fullExp})`)();
                        const sanitized = Number.isFinite(calcRes) ? parseFloat(calcRes.toFixed(8)).toString() : 'Error';
                        setHistory(prev => [{ exp: `${expression} ${display}`, res: sanitized }, ...prev.slice(0, 19)]);
                        setDisplay(sanitized);
                        setExpression('');
                    } catch {
                        setDisplay('Error');
                    }
                } else if (btn === '00') {
                    if (display !== '0') setDisplay(prev => prev + '00');
                } else {
                    if (display === '0' && btn !== '.') {
                        setDisplay(btn);
                    } else if (btn === '.' && display.includes('.')) {
                        return;
                    } else {
                        setDisplay(prev => prev + btn);
                    }
                }
            };

            const handleScientific = (op) => {
                triggerHaptic();
                try {
                    let v = parseFloat(display);
                    let res = 0;
                    if (op === 'sin') res = Math.sin(isRad ? v : (v * Math.PI) / 180);
                    if (op === 'cos') res = Math.cos(isRad ? v : (v * Math.PI) / 180);
                    if (op === 'tan') res = Math.tan(isRad ? v : (v * Math.PI) / 180);
                    if (op === 'log') res = Math.log10(v);
                    if (op === 'ln') res = Math.log(v);
                    if (op === 'sqrt') res = Math.sqrt(v);
                    if (op === 'sqr') res = Math.pow(v, 2);
                    if (op === 'cube') res = Math.pow(v, 3);
                    if (op === 'inv') res = 1 / v;
                    if (op === 'fact') {
                        if (v < 0 || v > 150) throw new Error('Range');
                        let f = 1;
                        for (let i = 2; i <= Math.floor(v); i++) f *= i;
                        res = f;
                    }
                    const finalRes = parseFloat(res.toFixed(8)).toString();
                    setHistory(prev => [{ exp: `${op}(${display})`, res: finalRes }, ...prev.slice(0, 19)]);
                    setDisplay(finalRes);
                } catch {
                    setDisplay('Error');
                }
            };

            // Conversions
            useEffect(() => {
                const units = Object.keys(CONVERSION_RATES[convCat]);
                setConvFrom(units[0]);
                setConvTo(units[1] || units[0]);
            }, [convCat]);

            const runConversion = () => {
                const val = parseFloat(convVal);
                if (isNaN(val)) return '0';
                if (convCat === 'temperature') {
                    if (convFrom === convTo) return val;
                    let c = val;
                    if (convFrom === 'f') c = (val - 32) * (5 / 9);
                    if (convFrom === 'k') c = val - 273.15;
                    let target = c;
                    if (convTo === 'f') target = (c * 9) / 5 + 32;
                    if (convTo === 'k') target = c + 273.15;
                    return parseFloat(target.toFixed(4));
                }
                const catMap = CONVERSION_RATES[convCat];
                if (!catMap) return '0';
                return parseFloat(((val * catMap[convFrom]) / catMap[convTo]).toFixed(6));
            };

            // AR Camera Handlers
            const startCamera = async () => {
                try {
                    setCapturedImage(null); setPoints([]); setMeasResult(null); setCameraActive(true);
                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }
                    });
                    if (videoRef.current) videoRef.current.srcObject = stream;
                } catch {
                    alert('Camera could not be accessed. You can upload an image instead.');
                    setCameraActive(false);
                }
            };

            const takeSnapshot = () => {
                triggerHaptic();
                if (!videoRef.current) return;
                const vid = videoRef.current;
                const canvas = document.createElement('canvas');
                canvas.width = vid.videoWidth || 1280;
                canvas.height = vid.videoHeight || 720;
                canvas.getContext('2d').drawImage(vid, 0, 0, canvas.width, canvas.height);
                setCapturedImage(canvas.toDataURL('image/jpeg'));
                if (vid.srcObject) vid.srcObject.getTracks().forEach(t => t.stop());
                setCameraActive(false);
            };

            const handleFileImage = (e) => {
                const f = e.target.files[0];
                if (f) {
                    const reader = new FileReader();
                    reader.onload = ev => {
                        setCapturedImage(ev.target.result);
                        setPoints([]);
                        setMeasResult(null);
                        setCameraActive(false);
                    };
                    reader.readAsDataURL(f);
                }
            };

            useEffect(() => {
                if (!capturedImage || !canvasRef.current) return;
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const img = new Image();
                img.onload = () => {
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);
                    if (points.length === 2) {
                        ctx.beginPath();
                        ctx.moveTo(points[0].x, points[0].y);
                        ctx.lineTo(points[1].x, points[1].y);
                        ctx.strokeStyle = '#f97316';
                        ctx.lineWidth = Math.max(4, canvas.width / 140);
                        ctx.stroke();
                    }
                    points.forEach((pt, i) => {
                        ctx.fillStyle = i === 0 ? '#10b981' : '#f43f5e';
                        ctx.beginPath();
                        ctx.arc(pt.x, pt.y, Math.max(10, canvas.width / 70), 0, Math.PI * 2);
                        ctx.fill();
                        ctx.strokeStyle = '#ffffff';
                        ctx.lineWidth = Math.max(3, canvas.width / 200);
                        ctx.stroke();
                    });
                };
                img.src = capturedImage;
            }, [capturedImage, points]);

            const onCanvasClick = (e) => {
                triggerHaptic();
                if (!capturedImage) return;
                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                const sx = canvas.width / rect.width;
                const sy = canvas.height / rect.height;
                const x = (e.clientX - rect.left) * sx;
                const y = (e.clientY - rect.top) * sy;

                let next = [...points, { x, y }];
                if (next.length > 2) next = [{ x, y }];
                setPoints(next);

                if (next.length === 2) {
                    const pixelDist = Math.hypot(next[1].x - next[0].x, next[1].y - next[0].y);
                    const scopes = { card_3in: 0.28, desk_4ft: 4.0, room_15ft: 15.0, room_20ft: 20.0, field_60ft: 60.0 };
                    const feetPerPixel = (scopes[calibMode] || 15.0) / Math.hypot(canvas.width, canvas.height);
                    const lenFt = pixelDist * feetPerPixel;
                    const lenM = lenFt * 0.3048;
                    const estAreaSqFt = lenFt * (lenFt * 0.7);
                    setMeasResult({
                        ft: lenFt.toFixed(2),
                        in: (lenFt * 12).toFixed(1),
                        m: lenM.toFixed(2),
                        cm: (lenM * 100).toFixed(1),
                        sqFt: estAreaSqFt.toFixed(2),
                        sqM: (estAreaSqFt * 0.092903).toFixed(2)
                    });
                }
            };

            const computeHealth = () => {
                const hM = parseFloat(userHeight) / 100;
                const wK = parseFloat(userWeight);
                if (!hM || !wK) return null;
                const bmi = wK / (hM * hM);
                let cat = 'Normal Weight';
                let col = 'text-emerald-600';
                if (bmi < 18.5) { cat = 'Underweight'; col = 'text-amber-600'; }
                else if (bmi >= 25 && bmi < 29.9) { cat = 'Overweight'; col = 'text-amber-600'; }
                else if (bmi >= 30) { cat = 'Obesity'; col = 'text-rose-600'; }
                const age = parseFloat(userAge) || 25;
                let bmr = userGender === 'male'
                    ? 88.362 + (13.397 * wK) + (4.799 * parseFloat(userHeight)) - (5.677 * age)
                    : 447.593 + (9.247 * wK) + (3.098 * parseFloat(userHeight)) - (4.330 * age);
                return { bmi: bmi.toFixed(1), cat, col, bmr: Math.round(bmr), water: (wK * 0.035).toFixed(1) };
            };
            const health = computeHealth();

            const calculateAge = () => {
                const start = new Date(dob);
                const end = new Date(cmpDate);
                if (isNaN(start) || isNaN(end) || end < start) return null;
                let y = end.getFullYear() - start.getFullYear();
                let m = end.getMonth() - start.getMonth();
                let d = end.getDate() - start.getDate();
                if (d < 0) { m--; d += new Date(end.getFullYear(), end.getMonth(), 0).getDate(); }
                if (m < 0) { y--; m += 12; }
                const totalDays = Math.floor((end - start) / (1000 * 60 * 60 * 24));
                let nextBday = new Date(end.getFullYear(), start.getMonth(), start.getDate());
                if (nextBday < end) nextBday = new Date(end.getFullYear() + 1, start.getMonth(), start.getDate());
                return { y, m, d, totalDays, totalWeeks: Math.floor(totalDays / 7), daysToBday: Math.ceil((nextBday - end) / (1000 * 60 * 60 * 24)) };
            };
            const age = calculateAge();

            return (
                <div className="flex flex-col h-screen max-w-md mx-auto bg-[#f1f3f6] shadow-xl overflow-hidden border-x border-slate-200">
                    {/* Top Native-Style Minimalist Bar */}
                    <header className="pt-[env(safe-area-inset-top)] px-5 py-3 flex items-center justify-between text-slate-600 shrink-0">
                        <button
                            onClick={() => { triggerHaptic(); setCalcMode(calcMode === 'standard' ? 'scientific' : 'standard'); }}
                            className="p-2 hover:bg-slate-200 rounded-full transition"
                            title="Toggle Scientific Mode"
                        >
                            <i className="fa-solid fa-square-root-variable text-lg"></i>
                        </button>

                        <div className="flex items-center space-x-3">
                            <button
                                onClick={() => { triggerHaptic(); setShowHistory(!showHistory); }}
                                className="p-2 hover:bg-slate-200 rounded-full transition"
                                title="History"
                            >
                                <i className="fa-solid fa-clock-rotate-left text-base"></i>
                            </button>
                            <span className="text-xs font-semibold text-slate-400">OmniCalc</span>
                        </div>
                    </header>

                    {/* Scrollable Container */}
                    <main className="flex-1 overflow-y-auto no-scrollbar px-4 pb-24 flex flex-col justify-end">
                        {/* ======================================= */}
                        {/* 1. CALCULATOR (MATCHING SCREENSHOT)     */}
                        {/* ======================================= */}
                        {activeTab === 'calc' && (
                            <div className="space-y-4">
                                {/* Display Canvas */}
                                <div className="text-right px-3 py-2 min-h-[140px] flex flex-col justify-end">
                                    <div className="text-sm font-mono text-slate-400 overflow-x-auto whitespace-nowrap">
                                        {expression || '\u00A0'}
                                    </div>
                                    <div className="text-5xl font-mono font-medium text-slate-900 mt-2 tracking-tight overflow-x-auto whitespace-nowrap">
                                        {display}
                                    </div>
                                </div>

                                {/* History Drawer */}
                                {showHistory && (
                                    <div className="bg-white rounded-3xl p-4 shadow-sm border border-slate-200 max-h-48 overflow-y-auto text-xs font-mono space-y-1.5 mb-2">
                                        <div className="flex justify-between items-center pb-1 border-b border-slate-100 text-slate-400 font-sans">
                                            <span className="font-semibold">Calculation History</span>
                                            <button onClick={() => setHistory([])} className="text-orange-500 font-medium">Clear</button>
                                        </div>
                                        {history.length === 0 ? (
                                            <div className="text-slate-400 text-center py-2 font-sans">No history yet</div>
                                        ) : (
                                            history.map((h, i) => (
                                                <div key={i} onClick={() => setDisplay(h.res)} className="flex justify-between py-1 cursor-pointer hover:bg-slate-50 px-1 rounded text-slate-600">
                                                    <span className="text-slate-400 truncate mr-2">{h.exp} =</span>
                                                    <span className="font-bold text-slate-800">{h.res}</span>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                )}

                                {/* Scientific Panel if Active */}
                                {calcMode === 'scientific' && (
                                    <div className="grid grid-cols-5 gap-2 bg-white/60 p-2.5 rounded-3xl border border-slate-200">
                                        {[
                                            { label: 'sin', act: () => handleScientific('sin') },
                                            { label: 'cos', act: () => handleScientific('cos') },
                                            { label: 'tan', act: () => handleScientific('tan') },
                                            { label: 'log', act: () => handleScientific('log') },
                                            { label: 'ln', act: () => handleScientific('ln') },
                                            { label: '√', act: () => handleScientific('sqrt') },
                                            { label: 'x²', act: () => handleScientific('sqr') },
                                            { label: 'x³', act: () => handleScientific('cube') },
                                            { label: '1/x', act: () => handleScientific('inv') },
                                            { label: 'π', act: () => handleCalc('π') }
                                        ].map((b, i) => (
                                            <button
                                                key={i}
                                                onClick={b.act}
                                                className="py-2 rounded-xl bg-slate-200/80 text-xs font-semibold text-slate-700 active:scale-95 transition"
                                            >
                                                {b.label}
                                            </button>
                                        ))}
                                    </div>
                                )}

                                {/* Main Keypad (Exact Layout from Screenshot) */}
                                <div className="grid grid-cols-4 gap-3.5 px-1">
                                    {/* Row 1 */}
                                    <button onClick={() => handleCalc('AC')} className="btn-circle bg-[#e1e4ea] text-slate-800 text-xl font-medium">AC</button>
                                    <button onClick={() => handleCalc('%')} className="btn-circle bg-[#e1e4ea] text-slate-800 text-xl font-medium">%</button>
                                    <button onClick={() => handleCalc('⌫')} className="btn-circle bg-[#e1e4ea] text-slate-800 text-xl">
                                        <i className="fa-solid fa-delete-left text-lg"></i>
                                    </button>
                                    <button onClick={() => handleCalc('÷')} className="btn-circle bg-[#e1e4ea] text-slate-800 text-2xl font-normal">÷</button>

                                    {/* Row 2 */}
                                    <button onClick={() => handleCalc('7')} className="btn-circle bg-white shadow-sm shadow-slate-200/60 text-slate-900 text-2xl font-medium">7</button>
                                    <button onClick={() => handleCalc('8')} className="btn-circle bg-white shadow-sm shadow-slate-200/60 text-slate-900 text-2xl font-medium">8</button>
                                    <button onClick={() => handleCalc('9')} className="btn-circle bg-white shadow-sm shadow-slate-200/60 text-slate-900 text-2xl font-medium">9</button>
                                    <button onClick={() => handleCalc('×')} className="btn-circle bg-[#e1e4ea] text-slate-800 text-2xl font-normal">×</button>

                                    {/* Row 3 */}
                                    <button onClick={() => handleCalc('4')} className="btn-circle bg-white shadow-sm shadow-slate-200/60 text-slate-900 text-2xl font-medium">4</button>
                                    <button onClick={() => handleCalc('5')} className="btn-circle bg-white shadow-sm shadow-slate-200/60 text-slate-900 text-2xl font-medium">5</button>
                                    <button onClick={() => handleCalc('6')} className="btn-circle bg-white shadow-sm shadow-slate-200/60 text-slate-900 text-2xl font-medium">6</button>
                                    <button onClick={() => handleCalc('-')} className="btn-circle bg-[#e1e4ea] text-slate-800 text-2xl font-normal">−</button>

                                    {/* Row 4 */}
                                    <button onClick={() => handleCalc('1')} className="btn-circle bg-white shadow-sm shadow-slate-200/60 text-slate-900 text-2xl font-medium">1</button>
                                    <button onClick={() => handleCalc('2')} className="btn-circle bg-white shadow-sm shadow-slate-200/60 text-slate-900 text-2xl font-medium">2</button>
                                    <button onClick={() => handleCalc('3')} className="btn-circle bg-white shadow-sm shadow-slate-200/60 text-slate-900 text-2xl font-medium">3</button>
                                    <button onClick={() => handleCalc('+')} className="btn-circle bg-[#e1e4ea] text-slate-800 text-2xl font-normal">+</button>

                                    {/* Row 5 */}
                                    <button onClick={() => handleCalc('00')} className="btn-circle bg-white shadow-sm shadow-slate-200/60 text-slate-900 text-xl font-medium">00</button>
