<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>OmniCalc Pro - Universal Suite with GPS</title>

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#f1f3f6">
    <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22OmniCalc%20Pro%22%2C%22short_name%22%3A%22OmniCalc%22%2C%22start_url%22%3A%22%2F%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23f1f3f6%22%2C%22theme_color%22%3A%22%23ff9500%22%7D">

    <!-- High-Speed Cloudflare CDNs + EXIF GPS Scanner -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.8/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exif-js/2.3.0/exif.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap');
        
        * { -webkit-tap-highlight-color: transparent; user-select: none; box-sizing: border-box; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f1f3f6; touch-action: manipulation; margin: 0; padding: 0; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .btn-circle {
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 9999px;
            transition: transform 0.1s ease, filter 0.1s ease;
            outline: none;
            border: none;
            cursor: pointer;
        }
        .btn-circle:active {
            transform: scale(0.92);
            filter: brightness(0.92);
        }
    </style>
</head>
<body class="text-slate-800 antialiased">
    <div id="root">
        <div style="height:100vh;display:flex;align-items:center;justify-content:center;font-family:sans-serif;color:#64748b;font-size:14px;">
            Loading OmniCalc Pro with GPS...
        </div>
    </div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const formatINR = (val) => {
            const num = parseFloat(val);
            if (isNaN(num)) return '₹0.00';
            return '₹' + num.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        };

        const triggerHaptic = () => {
            if (typeof window !== 'undefined' && window.navigator && window.navigator.vibrate) {
                try { window.navigator.vibrate(10); } catch(e) {}
            }
        };

        const CONVERSION_RATES = {
            length: { m: 1, cm: 0.01, mm: 0.001, km: 1000, in: 0.0254, ft: 0.3048, yd: 0.9144, mi: 1609.344 },
            mass: { kg: 1, g: 0.001, mg: 0.000001, lb: 0.453592, oz: 0.02835, ton: 1000 },
            volume: { l: 1, ml: 0.001, gal: 3.78541, qt: 0.94635, cup: 0.24, floz: 0.02957 },
            area: { sqm: 1, sqft: 0.0929, sqin: 0.000645, acre: 4046.86, hectare: 10000 },
            temperature: { c: 'C', f: 'F', k: 'K' },
            speed: { kmh: 1, mps: 3.6, mph: 1.60934, knot: 1.852 }
        };

        function App() {
            const [activeTab, setActiveTab] = useState('calc');
            const [calcMode, setCalcMode] = useState('standard');

            // --- CALCULATOR ---
            const [display, setDisplay] = useState('0');
            const [expression, setExpression] = useState('');
            const [history, setHistory] = useState([]);
            const [showHistory, setShowHistory] = useState(false);
            const [isRad, setIsRad] = useState(false);

            // --- CONVERTER ---
            const [convCat, setConvCat] = useState('length');
            const [convFrom, setConvFrom] = useState('m');
            const [convTo, setConvTo] = useState('ft');
            const [convVal, setConvVal] = useState('1');

            // --- MEASUREMENT & GPS ---
            const [capturedImage, setCapturedImage] = useState(null);
            const [measureShape, setMeasureShape] = useState('polygon');
            const [calibMode, setCalibMode] = useState('door_7ft');
            const [points, setPoints] = useState([]);
            const [measResult, setMeasResult] = useState(null);
            const [cameraActive, setCameraActive] = useState(false);
            const [photoGps, setPhotoGps] = useState(null); // { lat, lng, isFromFile: boolean }
            const [gpsStatusMessage, setGpsStatusMessage] = useState('');

            // --- FINANCE (INR) ---
            const [finTab, setFinTab] = useState('loan');
            const [loanPrincipal, setLoanPrincipal] = useState('2500000');
            const [loanInterest, setLoanInterest] = useState('8.5');
            const [loanYears, setLoanYears] = useState('20');
            const [invInit, setInvInit] = useState('50000');
            const [invAnnual, setInvAnnual] = useState('12');
            const [invYears, setInvYears] = useState('15');
            const [invMonthly, setInvMonthly] = useState('5000');
            const [gstBase, setGstBase] = useState('10000');
            const [gstRate, setGstRate] = useState('18');

            // --- HEALTH ---
            const [userHeight, setUserHeight] = useState('175');
            const [userWeight, setUserWeight] = useState('72');
            const [userAge, setUserAge] = useState('26');
            const [userGender, setUserGender] = useState('male');

            // --- AGE ---
            const [dob, setDob] = useState('1998-05-15');
            const [cmpDate, setCmpDate] = useState(new Date().toISOString().split('T')[0]);

            const fileRef = useRef(null);
            const canvasRef = useRef(null);
            const videoRef = useRef(null);

            // Calculator Engine
            const handleCalc = (btn) => {
                triggerHaptic();
                if (btn === 'AC') {
                    setDisplay('0');
                    setExpression('');
                } else if (btn === '⌫') {
                    setDisplay(prev => (prev.length > 1 ? prev.slice(0, -1) : '0'));
                } else if (btn === '%') {
                    const current = parseFloat(display) || 0;
                    setDisplay(String(current / 100));
                } else if (['+', '-', '×', '÷'].includes(btn)) {
                    setExpression(expression ? `${expression} ${display} ${btn}` : `${display} ${btn}`);
                    setDisplay('0');
                } else if (btn === '=') {
                    try {
                        let fullExp = (expression ? `${expression} ${display}` : display)
                            .replace(/×/g, '*')
                            .replace(/÷/g, '/')
                            .replace(/π/g, `${Math.PI}`)
                            .replace(/e/g, `${Math.E}`);

                        if (!/^[\d\s+\-*/.()MathPIE]+$/.test(fullExp)) throw new Error('Invalid');
                        const calcRes = Function(`"use strict"; return (${fullExp})`)();
                        const sanitized = Number.isFinite(calcRes) ? parseFloat(calcRes.toFixed(8)).toString() : 'Error';
                        setHistory(prev => [{ exp: `${expression} ${display}`, res: sanitized }, ...prev.slice(0, 19)]);
                        setDisplay(sanitized);
                        setExpression('');
                    } catch {
                        setDisplay('Error');
                    }
                } else if (btn === '00') {
                    if (display !== '0') setDisplay(prev => prev + '00');
                } else {
                    if (display === '0' && btn !== '.') {
                        setDisplay(btn);
                    } else if (btn === '.' && display.includes('.')) {
                        return;
                    } else {
                        setDisplay(prev => prev + btn);
                    }
                }
            };

            const handleScientific = (op) => {
                triggerHaptic();
                try {
                    let v = parseFloat(display);
                    let res = 0;
                    if (op === 'sin') res = Math.sin(isRad ? v : (v * Math.PI) / 180);
                    if (op === 'cos') res = Math.cos(isRad ? v : (v * Math.PI) / 180);
                    if (op === 'tan') res = Math.tan(isRad ? v : (v * Math.PI) / 180);
                    if (op === 'log') res = Math.log10(v);
                    if (op === 'ln') res = Math.log(v);
                    if (op === 'sqrt') res = Math.sqrt(v);
                    if (op === 'sqr') res = Math.pow(v, 2);
                    if (op === 'cube') res = Math.pow(v, 3);
                    if (op === 'inv') res = 1 / v;
                    setDisplay(parseFloat(res.toFixed(8)).toString());
                } catch {
                    setDisplay('Error');
                }
            };

            const runConversion = () => {
                const val = parseFloat(convVal);
                if (isNaN(val)) return '0';
                if (convCat === 'temperature') {
                    if (convFrom === convTo) return val;
                    let c = val;
                    if (convFrom === 'f') c = (val - 32) * (5 / 9);
                    if (convFrom === 'k') c = val - 273.15;
                    let target = c;
                    if (convTo === 'f') target = (c * 9) / 5 + 32;
                    if (convTo === 'k') target = c + 273.15;
                    return parseFloat(target.toFixed(4));
                }
                const catMap = CONVERSION_RATES[convCat];
                if (!catMap) return '0';
                return parseFloat(((val * catMap[convFrom]) / catMap[convTo]).toFixed(6));
            };

            // Camera Stream
            const startCamera = async () => {
                try {
                    setCapturedImage(null); setPoints([]); setMeasResult(null); setPhotoGps(null); setGpsStatusMessage(''); setCameraActive(true);
                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }
                    });
                    if (videoRef.current) videoRef.current.srcObject = stream;
                } catch {
                    alert('Camera could not be accessed. You can upload an image directly.');
                    setCameraActive(false);
                }
            };

            const takeSnapshot = () => {
                triggerHaptic();
                if (!videoRef.current) return;
                const vid = videoRef.current;
                const canvas = document.createElement('canvas');
                canvas.width = vid.videoWidth || 1280;
                canvas.height = vid.videoHeight || 720;
                canvas.getContext('2d').drawImage(vid, 0, 0, canvas.width, canvas.height);
                setCapturedImage(canvas.toDataURL('image/jpeg'));
                if (vid.srcObject) vid.srcObject.getTracks().forEach(t => t.stop());
                setCameraActive(false);
                setGpsStatusMessage('Live photo taken. Tap "Pin Live GPS" if you wish to tag this location.');
            };

            const convertDMSToDD = (degrees, minutes, seconds, direction) => {
                let dd = Number(degrees) + Number(minutes) / 60 + Number(seconds) / (60 * 60);
                if (direction === "S" || direction === "W") dd = dd * -1;
                return dd;
            };

            const handleFileImage = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                setPoints([]);
                setMeasResult(null);
                setPhotoGps(null);
                setGpsStatusMessage('Scanning photo for embedded GPS tags...');
                setCameraActive(false);

                // 1. Read preview image
                const reader = new FileReader();
                reader.onload = ev => {
                    setCapturedImage(ev.target.result);
                };
                reader.readAsDataURL(file);

                // 2. Scan EXIF tags directly from file binary
                if (window.EXIF) {
                    window.EXIF.getData(file, function() {
                        const lat = window.EXIF.getTag(this, "GPSLatitude");
                        const latRef = window.EXIF.getTag(this, "GPSLatitudeRef");
                        const lng = window.EXIF.getTag(this, "GPSLongitude");
                        const lngRef = window.EXIF.getTag(this, "GPSLongitudeRef");

                        if (lat && lng && latRef && lngRef) {
                            const decLat = convertDMSToDD(lat[0], lat[1], lat[2], latRef).toFixed(6);
                            const decLng = convertDMSToDD(lng[0], lng[1], lng[2], lngRef).toFixed(6);
                            setPhotoGps({ lat: decLat, lng: decLng, isFromFile: true });
                            setGpsStatusMessage('Location found in photo!');
                        } else {
                            setPhotoGps(null);
                            setGpsStatusMessage('No GPS tag found in this file (e.g. WhatsApp / Screenshots delete GPS tags).');
                        }
                    });
                }
            };

            const pinLiveGPS = () => {
                triggerHaptic();
                if (navigator.geolocation) {
                    setGpsStatusMessage('Acquiring phone satellite GPS...');
                    navigator.geolocation.getCurrentPosition(
                        pos => {
                            setPhotoGps({
                                lat: pos.coords.latitude.toFixed(6),
                                lng: pos.coords.longitude.toFixed(6),
                                isFromFile: false
                            });
                            setGpsStatusMessage('Tagged with phone live GPS.');
                        },
                        () => alert('Please allow location permission in your phone/browser settings.')
                    );
                }
            };

            // Canvas Renderer
            useEffect(() => {
                if (!capturedImage || !canvasRef.current) return;
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const img = new Image();
                img.onload = () => {
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);

                    const lineWidth = Math.max(3.5, canvas.width / 150);
                    const pinRadius = Math.max(8, canvas.width / 80);

                    if (measureShape === 'circle' && points.length >= 2) {
                        const radius = Math.hypot(points[1].x - points[0].x, points[1].y - points[0].y);
                        ctx.beginPath();
                        ctx.arc(points[0].x, points[0].y, radius, 0, Math.PI * 2);
                        ctx.fillStyle = 'rgba(255, 149, 0, 0.22)';
                        ctx.fill();
                        ctx.strokeStyle = '#ff9500';
                        ctx.lineWidth = lineWidth;
                        ctx.stroke();

                        ctx.beginPath();
                        ctx.moveTo(points[0].x, points[0].y);
                        ctx.lineTo(points[1].x, points[1].y);
                        ctx.setLineDash([8, 8]);
                        ctx.stroke();
                        ctx.setLineDash([]);
                    } else if (points.length >= 2) {
                        ctx.beginPath();
                        ctx.moveTo(points[0].x, points[0].y);
                        for (let i = 1; i < points.length; i++) {
                            ctx.lineTo(points[i].x, points[i].y);
                        }
                        if (measureShape === 'polygon' && points.length >= 3) {
                            ctx.closePath();
                            ctx.fillStyle = 'rgba(255, 149, 0, 0.22)';
                            ctx.fill();
                        }
                        ctx.strokeStyle = '#ff9500';
                        ctx.lineWidth = lineWidth;
                        ctx.stroke();
                    }

                    points.forEach((pt, i) => {
                        ctx.fillStyle = i === 0 ? '#10b981' : (i === points.length - 1 ? '#f43f5e' : '#3b82f6');
                        ctx.beginPath();
                        ctx.arc(pt.x, pt.y, pinRadius, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.strokeStyle = '#ffffff';
                        ctx.lineWidth = Math.max(2, canvas.width / 220);
                        ctx.stroke();

                        ctx.fillStyle = '#ffffff';
                        ctx.font = `bold ${Math.max(12, canvas.width / 55)}px sans-serif`;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(`${i + 1}`, pt.x, pt.y);
                    });
                };
                img.src = capturedImage;
            }, [capturedImage, points, measureShape]);

            // Spatial Math
            const computeMeasurements = (pts, w, h) => {
                const scopes = {
                    card_3in: 0.28,
                    desk_4ft: 4.0,
                    door_7ft: 7.0,
                    room_15ft: 15.0,
                    room_20ft: 20.0,
                    field_60ft: 60.0,
                    land_200ft: 200.0
                };
                const sceneScaleFeet = scopes[calibMode] || 15.0;
                const diagPixels = Math.hypot(w, h);
                const feetPerPixel = sceneScaleFeet / diagPixels;

                if (measureShape === 'circle' && pts.length >= 2) {
                    const rPixels = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
                    const rFeet = rPixels * feetPerPixel;
                    const rMeters = rFeet * 0.3048;
                    const areaSqFt = Math.PI * Math.pow(rFeet, 2);

                    setMeasResult({
                        type: 'circle',
                        radiusFt: rFeet.toFixed(2),
                        radiusM: rMeters.toFixed(2),
                        areaSqFt: areaSqFt.toFixed(2),
                        areaSqM: (areaSqFt * 0.092903).toFixed(2),
                        circumferenceFt: (2 * Math.PI * rFeet).toFixed(2)
                    });
                } else if (measureShape === 'line' && pts.length >= 2) {
                    const pixelDist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
                    const lenFt = pixelDist * feetPerPixel;
                    const lenM = lenFt * 0.3048;

                    setMeasResult({
                        type: 'line',
                        ft: lenFt.toFixed(2),
                        in: (lenFt * 12).toFixed(1),
                        m: lenM.toFixed(2),
                        cm: (lenM * 100).toFixed(1)
                    });
                } else if (measureShape === 'polygon' && pts.length >= 3) {
                    let pixelArea = 0;
                    let perimeterPixels = 0;
                    const n = pts.length;
                    for (let i = 0; i < n; i++) {
                        const j = (i + 1) % n;
                        pixelArea += pts[i].x * pts[j].y;
                        pixelArea -= pts[j].x * pts[i].y;
                        perimeterPixels += Math.hypot(pts[j].x - pts[i].x, pts[j].y - pts[i].y);
                    }
                    pixelArea = Math.abs(pixelArea) / 2;

                    const sqFeetPerPixelSq = Math.pow(feetPerPixel, 2);
                    const areaSqFt = pixelArea * sqFeetPerPixelSq;

                    setMeasResult({
                        type: 'polygon',
                        ptsCount: n,
                        areaSqFt: areaSqFt.toFixed(2),
                        areaSqM: (areaSqFt * 0.092903).toFixed(2),
                        acres: (areaSqFt / 43560).toFixed(4),
                        cents: (areaSqFt / 435.6).toFixed(2),
                        gaj: (areaSqFt / 9).toFixed(1),
                        perimeterFt: (perimeterPixels * feetPerPixel).toFixed(2)
                    });
                }
            };

            const onCanvasClick = (e) => {
                triggerHaptic();
                if (!capturedImage) return;
                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                const sx = canvas.width / rect.width;
                const sy = canvas.height / rect.height;
                const x = (e.clientX - rect.left) * sx;
                const y = (e.clientY - rect.top) * sy;

                let next = [...points, { x, y }];
                if (measureShape === 'line' && next.length > 2) next = [{ x, y }];
                if (measureShape === 'circle' && next.length > 2) next = [{ x, y }];
                setPoints(next);

                computeMeasurements(next, canvas.width, canvas.height);
            };

            // Health
            const computeHealth = () => {
                const hM = parseFloat(userHeight) / 100;
                const wK = parseFloat(userWeight);
                if (!hM || !wK) return null;
                const bmi = wK / (hM * hM);
                let cat = 'Normal Weight';
                let col = 'text-emerald-600';
                if (bmi < 18.5) { cat = 'Underweight'; col = 'text-amber-600'; }
                else if (bmi >= 25 && bmi < 29.9) { cat = 'Overweight'; col = 'text-amber-600'; }
                else if (bmi >= 30) { cat = 'Obesity'; col = 'text-rose-600'; }
                const age = parseFloat(userAge) || 25;
                let bmr = userGender === 'male'
                    ? 88.362 + (13.397 * wK) + (4.799 * parseFloat(userHeight)) - (5.677 * age)
                    : 447.593 + (9.247 * wK) + (3.098 * parseFloat(userHeight)) - (4.330 * age);
                return { bmi: bmi.toFixed(1), cat, col, bmr: Math.round(bmr), water: (wK * 0.035).toFixed(1) };
            };
            const health = computeHealth();

            // Age
            const calculateAge = () => {
                const start = new Date(dob);
                const end = new Date(cmpDate);
                if (isNaN(start) || isNaN(end) || end < start) return null;
                let y = end.getFullYear() - start.getFullYear();
                let m = end.getMonth() - start.getMonth();
                let d = end.getDate() - start.getDate();
                if (d < 0) { m--; d += new Date(end.getFullYear(), end.getMonth(), 0).getDate(); }
                if (m < 0) { y--; m += 12; }
                const totalDays = Math.floor((end - start) / (1000 * 60 * 60 * 24));
                let nextBday = new Date(end.getFullYear(), start.getMonth(), start.getDate());
                if (nextBday < end) nextBday = new Date(end.getFullYear() + 1, start.getMonth(), start.getDate());
                return { y, m, d, totalDays, daysToBday: Math.ceil((nextBday - end) / (1000 * 60 * 60 * 24)) };
            };
            const age = calculateAge();

            return (
                <div className="flex flex-col h-screen max-w-md mx-auto bg-[#f1f3f6] shadow-xl overflow-hidden border-x border-slate-200">
                    {/* Header */}
                    <header className="px-5 py-3 flex items-center justify-between text-slate-600 shrink-0 border-b border-slate-200/60 bg-[#f1f3f6]">
                        <button
                            onClick={() => { triggerHaptic(); setCalcMode(calcMode === 'standard' ? 'scientific' : 'standard'); }}
                            className="p-2 hover:bg-slate-200 rounded-full transition"
                            title="Scientific Calculator"
                        >
                            <i className="fa-solid fa-square-root-variable text-lg text-slate-700"></i>
                        </button>
                        <span className="text-sm font-bold text-slate-700">OmniCalc Pro</span>
                        <button
                            onClick={() => { triggerHaptic(); setShowHistory(!showHistory); }}
                            className="p-2 hover:bg-slate-200 rounded-full transition"
                            title="History Log"
                        >
                            <i className="fa-solid fa-clock-rotate-left text-base text-slate-700"></i>
                        </button>
                    </header>

                    {/* Main Workspace */}
                    <main className="flex-1 overflow-y-auto no-scrollbar px-4 pb-24 flex flex-col justify-end">
                        {/* 1. CALCULATOR */}
                        {activeTab === 'calc' && (
                            <div className="space-y-4">
                                <div className="text-right px-4 py-2 min-h-[140px] flex flex-col justify-end">
                                    <div className="text-sm font-mono text-slate-400 overflow-x-auto whitespace-nowrap">
                                        {expression || '\u00A0'}
                                    </div>
                                    <div className="text-6xl font-mono font-normal text-slate-900 mt-2 tracking-tight overflow-x-auto whitespace-nowrap select-none">
                                        {display}
                                    </div>
                                </div>

                                {showHistory && (
                                    <div className="bg-white rounded-3xl p-4 shadow-sm border border-slate-200 max-h-44 overflow-y-auto text-xs font-mono space-y-1.5 mb-2">
                                        <div className="flex justify-between items-center pb-1 border-b border-slate-100 text-slate-400 font-sans">
                                            <span className="font-semibold">Calculation History</span>
                                            <button onClick={() => setHistory([])} className="text-orange-500 font-medium">Clear</button>
                                        </div>
                                        {history.length === 0 ? (
                                            <div className="text-slate-400 text-center py-2 font-sans">No history yet</div>
                                        ) : (
                                            history.map((h, i) => (
                                                <div key={i} onClick={() => setDisplay(h.res)} className="flex justify-between py-1 cursor-pointer hover:bg-slate-50 px-1 rounded text-slate-600">
                                                    <span className="text-slate-400 truncate mr-2">{h.exp} =</span>
                                                    <span className="font-bold text-slate-800">{h.res}</span>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                )}

                                {calcMode === 'scientific' && (
                                    <div className="grid grid-cols-5 gap-2 bg-white/70 p-2.5 rounded-3xl border border-slate-200">

                                            ))}
                                        </div>
                                        <div className="p-4 bg-orange-50 rounded-2xl border border-orange-200 mt-2">
                                            <div className="text-xs text-slate-500">GST: <strong>{formatINR((parseFloat(gstBase) * parseFloat(gstRate)) / 100)}</strong></div>
                                            <div className="text-lg font-bold font-mono text-slate-900 mt-1">Total: {formatINR(parseFloat(gstBase) * (1 + parseFloat(gstRate) / 100))}</div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* 5. HEALTH */}
                        {activeTab === 'health' && (
                            <div className="space-y-4 pt-4">
                                <div className="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm space-y-3">
                                    <div className="grid grid-cols-2 gap-2.5">
                                        <div>
                                            <label className="text-xs text-slate-500 font-medium">Height (cm)</label>
                                            <input type="number" value={userHeight} onChange={e => setUserHeight(e.target.value)} className="w-full mt-1 bg-slate-50 border border-slate-200 rounded-2xl p-2.5 text-sm font-mono text-slate-900" />
                                        </div>
                                        <div>
                                            <label className="text-xs text-slate-500 font-medium">Weight (kg)</label>
                                            <input type="number" value={userWeight} onChange={e => setUserWeight(e.target.value)} className="w-full mt-1 bg-slate-50 border border-slate-200 rounded-2xl p-2.5 text-sm font-mono text-slate-900" />
                                        </div>
                                    </div>
                                </div>
                                {health && (
                                    <div className="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm flex items-center justify-between">
                                        <div>
                                            <div className="text-xs text-slate-400 font-medium">Body Mass Index (BMI)</div>
                                            <div className="text-3xl font-extrabold font-mono text-slate-900 mt-0.5">{health.bmi}</div>
                                            <div className={`text-xs font-semibold mt-1 ${health.col}`}>{health.cat}</div>
                                        </div>
                                        <div className="text-right">
                                            <div className="text-[11px] text-slate-400">Daily BMR: <strong className="text-slate-800">{health.bmr} kcal</strong></div>
                                            <div className="text-[11px] text-slate-400 mt-1">Water Goal: <strong className="text-orange-500">{health.water} L</strong></div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* 6. AGE */}
                        {activeTab === 'date' && (
                            <div className="space-y-4 pt-4">
                                <div className="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm space-y-3">
                                    <label className="text-xs text-slate-500 font-medium">Date of Birth</label>
                                    <input type="date" value={dob} onChange={e => setDob(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-2xl p-2.5 text-sm text-slate-800" />
                                </div>
                                {age && (
                                    <div className="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm text-center">
                                        <div className="text-xs font-semibold text-slate-400 uppercase tracking-widest">Exact Age</div>
                                        <div className="text-2xl font-bold text-slate-900 mt-1">{age.y} yrs {age.m} mos {age.d} days</div>
                                        <div className="text-xs text-orange-500 font-medium mt-1">{age.daysToBday} days to next birthday</div>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    {/* Navigation Bar */}
                    <nav className="fixed bottom-0 w-full max-w-md bg-white/95 backdrop-blur-md border-t border-slate-200 px-2 pt-2 pb-3 z-30 flex justify-between items-center">
                        {[
                            { id: 'calc', label: 'Calc', icon: 'calculator' },
                            { id: 'converter', label: 'Convert', icon: 'arrow-right-arrow-left' },
                            { id: 'measure', label: 'Measure', icon: 'ruler-combined' },
                            { id: 'finance', label: 'Finance', icon: 'indian-rupee-sign' },
                            { id: 'health', label: 'Health', icon: 'heart-pulse' },
                            { id: 'date', label: 'Age', icon: 'calendar-day' }
                        ].map(tab => (
                            <button
                                key={tab.id}
                                onClick={() => { triggerHaptic(); setActiveTab(tab.id); }}
                                className={`flex flex-col items-center justify-center py-1 px-2 rounded-xl transition ${
                                    activeTab === tab.id ? 'text-[#ff9500] font-bold' : 'text-slate-400 hover:text-slate-600'
                                }`}
                            >
                                <i className={`fa-solid fa-${tab.icon} text-base mb-1`}></i>
                                <span className="text-[9px] tracking-tight">{tab.label}</span>
                            </button>
                        ))}
                    </nav>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
