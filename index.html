<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>OmniCalc Pro</title>

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#f1f3f6">

    <!-- High-Speed Cloudflare CDNs (Never Blocked) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.8/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap');
        
        * { -webkit-tap-highlight-color: transparent; user-select: none; box-sizing: border-box; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f1f3f6; touch-action: manipulation; margin: 0; padding: 0; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .btn-circle {
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 9999px;
            transition: transform 0.1s ease, filter 0.1s ease;
            outline: none;
            border: none;
            cursor: pointer;
        }
        .btn-circle:active {
            transform: scale(0.92);
            filter: brightness(0.92);
        }
    </style>
</head>
<body class="text-slate-800 antialiased">
    <div id="root">
        <!-- Instant loading placeholder so you never see a blank screen -->
        <div style="height:100vh;display:flex;align-items:center;justify-content:center;font-family:sans-serif;color:#64748b;font-size:14px;">
            Loading OmniCalc Pro...
        </div>
    </div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const formatINR = (val) => {
            const num = parseFloat(val);
            if (isNaN(num)) return '₹0.00';
            return '₹' + num.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        };

        const triggerHaptic = () => {
            if (typeof window !== 'undefined' && window.navigator && window.navigator.vibrate) {
                try { window.navigator.vibrate(10); } catch(e) {}
            }
        };

        const CONVERSION_RATES = {
            length: { m: 1, cm: 0.01, mm: 0.001, km: 1000, in: 0.0254, ft: 0.3048, yd: 0.9144, mi: 1609.344 },
            mass: { kg: 1, g: 0.001, mg: 0.000001, lb: 0.453592, oz: 0.02835, ton: 1000 },
            volume: { l: 1, ml: 0.001, gal: 3.78541, qt: 0.94635, cup: 0.24, floz: 0.02957 },
            area: { sqm: 1, sqft: 0.0929, sqin: 0.000645, acre: 4046.86, hectare: 10000 },
            temperature: { c: 'C', f: 'F', k: 'K' },
            speed: { kmh: 1, mps: 3.6, mph: 1.60934, knot: 1.852 }
        };

        function App() {
            const [activeTab, setActiveTab] = useState('calc');
            const [calcMode, setCalcMode] = useState('standard');

            // --- CALCULATOR STATE ---
            const [display, setDisplay] = useState('0');
            const [expression, setExpression] = useState('');
            const [history, setHistory] = useState([]);
            const [showHistory, setShowHistory] = useState(false);
            const [isRad, setIsRad] = useState(false);

            // --- CONVERTER STATE ---
            const [convCat, setConvCat] = useState('length');
            const [convFrom, setConvFrom] = useState('m');
            const [convTo, setConvTo] = useState('ft');
            const [convVal, setConvVal] = useState('1');

            // --- FINANCE STATE (INR) ---
            const [finTab, setFinTab] = useState('loan');
            const [loanPrincipal, setLoanPrincipal] = useState('2500000');
            const [loanInterest, setLoanInterest] = useState('8.5');
            const [loanYears, setLoanYears] = useState('20');
            const [invInit, setInvInit] = useState('50000');
            const [invAnnual, setInvAnnual] = useState('12');
            const [invYears, setInvYears] = useState('15');
            const [invMonthly, setInvMonthly] = useState('5000');
            const [gstBase, setGstBase] = useState('10000');
            const [gstRate, setGstRate] = useState('18');

            // --- HEALTH STATE ---
            const [userHeight, setUserHeight] = useState('175');
            const [userWeight, setUserWeight] = useState('72');
            const [userAge, setUserAge] = useState('26');
            const [userGender, setUserGender] = useState('male');

            // --- DATE STATE ---
            const [dob, setDob] = useState('1998-05-15');
            const [cmpDate, setCmpDate] = useState(new Date().toISOString().split('T')[0]);

            const handleCalc = (btn) => {
                triggerHaptic();
                if (btn === 'AC') {
                    setDisplay('0');
                    setExpression('');
                } else if (btn === '⌫') {
                    setDisplay(prev => (prev.length > 1 ? prev.slice(0, -1) : '0'));
                } else if (btn === '%') {
                    const current = parseFloat(display) || 0;
                    setDisplay(String(current / 100));
                } else if (['+', '-', '×', '÷'].includes(btn)) {
                    setExpression(expression ? `${expression} ${display} ${btn}` : `${display} ${btn}`);
                    setDisplay('0');
                } else if (btn === '=') {
                    try {
                        let fullExp = (expression ? `${expression} ${display}` : display)
                            .replace(/×/g, '*')
                            .replace(/÷/g, '/')
                            .replace(/π/g, `${Math.PI}`)
                            .replace(/e/g, `${Math.E}`);

                        if (!/^[\d\s+\-*/.()MathPIE]+$/.test(fullExp)) throw new Error('Invalid');
                        const calcRes = Function(`"use strict"; return (${fullExp})`)();
                        const sanitized = Number.isFinite(calcRes) ? parseFloat(calcRes.toFixed(8)).toString() : 'Error';
                        setHistory(prev => [{ exp: `${expression} ${display}`, res: sanitized }, ...prev.slice(0, 19)]);
                        setDisplay(sanitized);
                        setExpression('');
                    } catch {
                        setDisplay('Error');
                    }
                } else if (btn === '00') {
                    if (display !== '0') setDisplay(prev => prev + '00');
                } else {
                    if (display === '0' && btn !== '.') {
                        setDisplay(btn);
                    } else if (btn === '.' && display.includes('.')) {
                        return;
                    } else {
                        setDisplay(prev => prev + btn);
                    }
                }
            };

            const handleScientific = (op) => {
                triggerHaptic();
                try {
                    let v = parseFloat(display);
                    let res = 0;
                    if (op === 'sin') res = Math.sin(isRad ? v : (v * Math.PI) / 180);
                    if (op === 'cos') res = Math.cos(isRad ? v : (v * Math.PI) / 180);
                    if (op === 'tan') res = Math.tan(isRad ? v : (v * Math.PI) / 180);
                    if (op === 'log') res = Math.log10(v);
                    if (op === 'ln') res = Math.log(v);
                    if (op === 'sqrt') res = Math.sqrt(v);
                    if (op === 'sqr') res = Math.pow(v, 2);
                    if (op === 'cube') res = Math.pow(v, 3);
                    if (op === 'inv') res = 1 / v;
                    setDisplay(parseFloat(res.toFixed(8)).toString());
                } catch {
                    setDisplay('Error');
                }
            };

            const runConversion = () => {
                const val = parseFloat(convVal);
                if (isNaN(val)) return '0';
                if (convCat === 'temperature') {
                    if (convFrom === convTo) return val;
                    let c = val;
                    if (convFrom === 'f') c = (val - 32) * (5 / 9);
                    if (convFrom === 'k') c = val - 273.15;
                    let target = c;
                    if (convTo === 'f') target = (c * 9) / 5 + 32;
                    if (convTo === 'k') target = c + 273.15;
                    return parseFloat(target.toFixed(4));
                }
                const catMap = CONVERSION_RATES[convCat];
                if (!catMap) return '0';
                return parseFloat(((val * catMap[convFrom]) / catMap[convTo]).toFixed(6));
            };

            const computeHealth = () => {
                const hM = parseFloat(userHeight) / 100;
                const wK = parseFloat(userWeight);
                if (!hM || !wK) return null;
                const bmi = wK / (hM * hM);
                let cat = 'Normal Weight';
                let col = 'text-emerald-600';
                if (bmi < 18.5) { cat = 'Underweight'; col = 'text-amber-600'; }
                else if (bmi >= 25 && bmi < 29.9) { cat = 'Overweight'; col = 'text-amber-600'; }
                else if (bmi >= 30) { cat = 'Obesity'; col = 'text-rose-600'; }
                const age = parseFloat(userAge) || 25;
                let bmr = userGender === 'male'
                    ? 88.362 + (13.397 * wK) + (4.799 * parseFloat(userHeight)) - (5.677 * age)
                    : 447.593 + (9.247 * wK) + (3.098 * parseFloat(userHeight)) - (4.330 * age);
                return { bmi: bmi.toFixed(1), cat, col, bmr: Math.round(bmr), water: (wK * 0.035).toFixed(1) };
            };
            const health = computeHealth();

            const calculateAge = () => {
                const start = new Date(dob);
                const end = new Date(cmpDate);
                if (isNaN(start) || isNaN(end) || end < start) return null;
                let y = end.getFullYear() - start.getFullYear();
                let m = end.getMonth() - start.getMonth();
                let d = end.getDate() - start.getDate();
                if (d < 0) { m--; d += new Date(end.getFullYear(), end.getMonth(), 0).getDate(); }
                if (m < 0) { y--; m += 12; }
                const totalDays = Math.floor((end - start) / (1000 * 60 * 60 * 24));
                let nextBday = new Date(end.getFullYear(), start.getMonth(), start.getDate());
                if (nextBday < end) nextBday = new Date(end.getFullYear() + 1, start.getMonth(), start.getDate());
                return { y, m, d, totalDays, daysToBday: Math.ceil((nextBday - end) / (1000 * 60 * 60 * 24)) };
            };
            const age = calculateAge();

            return (
                <div className="flex flex-col h-screen max-w-md mx-auto bg-[#f1f3f6] shadow-xl overflow-hidden border-x border-slate-200">
                    {/* Header */}
                    <header className="px-5 py-3 flex items-center justify-between text-slate-600 shrink-0 border-b border-slate-200/60 bg-[#f1f3f6]">
                        <button
                            onClick={() => { triggerHaptic(); setCalcMode(calcMode === 'standard' ? 'scientific' : 'standard'); }}
                            className="p-2 hover:bg-slate-200 rounded-full transition"
                            title="Scientific Mode"
                        >
                            <i className="fa-solid fa-square-root-variable text-lg text-slate-700"></i>
                        </button>
                        <span className="text-sm font-bold text-slate-700">OmniCalc Pro</span>
                        <button
                            onClick={() => { triggerHaptic(); setShowHistory(!showHistory); }}
                            className="p-2 hover:bg-slate-200 rounded-full transition"
                            title="History"
                        >
                            <i className="fa-solid fa-clock-rotate-left text-base text-slate-700"></i>
                        </button>
                    </header>

                    {/* Main Area */}
                    <main className="flex-1 overflow-y-auto no-scrollbar px-4 pb-24 flex flex-col justify-end">
                        {/* 1. CALCULATOR */}
                        {activeTab === 'calc' && (
                            <div className="space-y-4">
                                <div className="text-right px-3 py-2 min-h-[140px] flex flex-col justify-end">
                                    <div className="text-sm font-mono text-slate-400 overflow-x-auto whitespace-nowrap">
                                        {expression || '\u00A0'}
                                    </div>
                                    <div className="text-5xl font-mono font-medium text-slate-900 mt-2 tracking-tight overflow-x-auto whitespace-nowrap">
                                        {display}
                                    </div>
                                </div>

                                {showHistory && (
                                    <div className="bg-white rounded-3xl p-4 shadow-sm border border-slate-200 max-h-44 overflow-y-auto text-xs font-mono space-y-1.5 mb-2">
                                        <div className="flex justify-between items-center pb-1 border-b border-slate-100 text-slate-400 font-sans">
                                            <span className="font-semibold">History</span>
                                            <button onClick={() => setHistory([])} className="text-orange-500 font-medium">Clear</button>
                                        </div>
                                        {history.length === 0 ? (
                                            <div className="text-slate-400 text-center py-2 font-sans">No history yet</div>
                                        ) : (
                                            history.map((h, i) => (
                                                <div key={i} onClick={() => setDisplay(h.res)} className="flex justify-between py-1 cursor-pointer hover:bg-slate-50 px-1 rounded text-slate-600">
                                                    <span className="text-slate-400 truncate mr-2">{h.exp} =</span>
                                                    <span className="font-bold text-slate-800">{h.res}</span>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                )}

                                {calcMode === 'scientific' && (
                                    <div className="grid grid-cols-5 gap-2 bg-white/70 p-2.5 rounded-3xl border border-slate-200">
                                        {[
                                            { label: 'sin', act: () => handleScientific('sin') },
                                            { label: 'cos', act: () => handleScientific('cos') },
                                            { label: 'tan', act: () => handleScientific('tan') },
                                            { label: 'log', act: () => handleScientific('log') },
                                            { label: 'ln', act: () => handleScientific('ln') },
                                            { label: '√', act: () => handleScientific('sqrt') },
                                            { label: 'x²', act: () => handleScientific('sqr') },
                                            { label: 'x³', act: () => handleScientific('cube') },
                                            { label: '1/x', act: () => handleScientific('inv') },
                                            { label: 'π', act: () => handleCalc('π') }
                                        ].map((b, i) => (
                                            <button key={i} onClick={b.act} className="py-2 rounded-xl bg-slate-200/80 text-xs font-semibold text-slate-700 active:scale-95 transition">
                                                {b.label}
                                            </button>
                                        ))}
                                    </div>
                                )}

                                {/* Keypad matching screenshot */}
                                <div className="grid grid-cols-4 gap-3.5 px-1">
                                    <button onClick={() => handleCalc('AC')} className="btn-circle bg-[#e1e4ea] text-slate-800 text-xl font-medium">AC</button>
                                    <button onClick={() => handleCalc('%')} className="btn-circle bg-[#e1e4ea] text-slate-800 text-xl font-medium">%</button>
                                    <button onClick={() => handleCalc('⌫')} className="btn-circle bg-[#e1e4ea] text-slate-800 text-xl">
                                        <i className="fa-solid fa-delete-left text-lg"></i>
                                    </button>
                                    <button onClick={() => handleCalc('÷')} className="btn-circle bg-[#e1e4ea] text-slate-800 text-2xl font-normal">÷</button>

                                    <button onClick={() => handleCalc('7')} className="btn-circle bg-white shadow-sm shadow-slate-200/60 text-slate-900 text-2xl font-medium">7</button>
                                    <button onClick={() => handleCalc('8')} className="btn-circle bg-white shadow-sm shadow-slate-200/60 text-slate-900 text-2xl font-medium">8</button>
                                    <button onClick={() => handleCalc('9')} className="btn-circle bg-white shadow-sm shadow-slate-200/60 text-slate-900 text-2xl font-medium">9</button>
                                    <button onClick={() => handleCalc('×')} className="btn-circle bg-[#e1e4ea] text-slate-800 text-2xl font-normal">×</button>

                                    <button onClick={() => handleCalc('4')} className="btn-circle bg-white shadow-sm shadow-slate-200/60 text-slate-900 text-2xl font-medium">4</button>
                                    <button onClick={() => handleCalc('5')} className="btn-circle bg-white shadow-sm shadow-slate-200/60 text-slate-900 text-2xl font-medium">5</button>
                                    <button onClick={() => handleCalc('6')} className="btn-circle bg-white shadow-sm shadow-slate-200/60 text-slate-900 text-2xl font-medium">6</button>
                                    <button onClick={() => handleCalc('-')} className="btn-circle bg-[#e1e4ea] text-slate-800 text-2xl font-normal">−</button>

                                    <button onClick={() => handleCalc('1')} className="btn-circle bg-white shadow-sm shadow-slate-200/60 text-slate-900 text-2xl font-medium">1</button>
                                    <button onClick={() => handleCalc('2')} className="btn-circle bg-white shadow-sm shadow-slate-200/60 text-slate-900 text-2xl font-medium">2</button>
                                    <button onClick={() => handleCalc('3')} className="btn-circle bg-white shadow-sm shadow-slate-200/60 text-slate-900 text-2xl font-medium">3</button>
                                    <button onClick={() => handleCalc('+')} className="btn-circle bg-[#e1e4ea] text-slate-800 text-2xl font-normal">+</button>

                                    <button onClick={() => handleCalc('00')} className="btn-circle bg-white shadow-sm shadow-slate-200/60 text-slate-900 text-xl font-medium">00</button>
                                    <button onClick={() => handleCalc('0')} className="btn-circle bg-white shadow-sm shadow-slate-200/60 text-slate-900 text-2xl font-medium">0</button>
                                    <button onClick={() => handleCalc('.')} className="btn-circle bg-white shadow-sm shadow-slate-200/60 text-slate-900 text-2xl font-bold">.</button>
                                    <button onClick={() => handleCalc('=')} className="btn-circle bg-[#ff9500] hover:bg-orange-500 text-white text-3xl font-medium shadow-md shadow-orange-500/30">=</button>
                                </div>
                            </div>
                        )}

                        {/* 2. CONVERTER */}
                        {activeTab === 'converter' && (
                            <div className="space-y-4 pt-4">
                                <div className="flex overflow-x-auto space-x-2 py-1 no-scrollbar">
                                    {['length', 'mass', 'volume', 'area', 'temperature', 'speed'].map(cat => (
                                        <button
                                            key={cat}
                                            onClick={() => { triggerHaptic(); setConvCat(cat); }}
                                            className={`px-4 py-2 rounded-full text-xs font-semibold capitalize whitespace-nowrap ${
                                                convCat === cat ? 'bg-[#ff9500] text-white' : 'bg-white text-slate-600 border border-slate-200'
                                            }`}
                                        >
                                            {cat}
                                        </button>
                                    ))}
                                </div>
                                <div className="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm space-y-4">
                                    <input
                                        type="number"
                                        value={convVal}
                                        onChange={e => setConvVal(e.target.value)}
                                        className="w-full bg-slate-50 border border-slate-200 rounded-2xl p-3 text-xl font-mono text-slate-900 focus:outline-none"
                                    />
                                    <div className="grid grid-cols-2 gap-3">
                                        <select
                                            value={convFrom}
                                            onChange={e => setConvFrom(e.target.value)}
                                            className="bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-sm font-semibold uppercase text-slate-700"
                                        >
                                            {Object.keys(CONVERSION_RATES[convCat]).map(u => <option key={u} value={u}>{u.toUpperCase()}</option>)}
                                        </select>
                                        <select
                                            value={convTo}
                                            onChange={e => setConvTo(e.target.value)}
                                            className="bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-sm font-semibold uppercase text-slate-700"
                                        >
                                            {Object.keys(CONVERSION_RATES[convCat]).map(u => <option key={u} value={u}>{u.toUpperCase()}</option>)}
                                        </select>
                                    </div>
                                </div>
                                <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm text-center">
                                    <div className="text-xs font-semibold text-slate-400 uppercase">Converted Result</div>
                                    <div className="text-3xl font-bold font-mono text-slate-900 mt-2">
                                        {runConversion()} <span className="text-sm font-sans text-orange-500 uppercase">{convTo}</span>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* 3. FINANCE */}
                        {activeTab === 'finance' && (
                            <div className="space-y-4 pt-4">
                                <div className="grid grid-cols-3 gap-1 bg-slate-200/80 p-1 rounded-full text-xs">
                                    <button onClick={() => setFinTab('loan')} className={`py-2 rounded-full font-semibold ${finTab === 'loan' ? 'bg-white text-slate-900 shadow' : 'text-slate-600'}`}>Loan EMI</button>
                                    <button onClick={() => setFinTab('sip')} className={`py-2 rounded-full font-semibold ${finTab === 'sip' ? 'bg-white text-slate-900 shadow' : 'text-slate-600'}`}>SIP / Growth</button>
                                    <button onClick={() => setFinTab('gst')} className={`py-2 rounded-full font-semibold ${finTab === 'gst' ? 'bg-white text-slate-900 shadow' : 'text-slate-600'}`}>GST Tax</button>
                                </div>

                                {finTab === 'loan' && (
                                    <div className="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm space-y-3">
                                        <label className="text-xs text-slate-500 font-medium">Loan Amount (₹)</label>
                                        <input type="number" value={loanPrincipal} onChange={e => setLoanPrincipal(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-2xl p-2.5 text-sm font-mono text-slate-900" />
                                        <div className="grid grid-cols-2 gap-2">
                                            <div>
                                                <label className="text-xs text-slate-500 font-medium">Interest (% p.a.)</label>
                                                <input type="number" step="0.1" value={loanInterest} onChange={e => setLoanInterest(e.target.value)} className="w-full mt-1 bg-slate-50 border border-slate-200 rounded-2xl p-2.5 text-sm font-mono text-slate-900" />
                                            </div>
                                            <div>
                                                <label className="text-xs text-slate-500 font-medium">Tenure (Years)</label>
                                                <input type="number" value={loanYears} onChange={e => setLoanYears(e.target.value)} className="w-full mt-1 bg-slate-50 border border-slate-200 rounded-2xl p-2.5 text-sm font-mono text-slate-900" />
                                            </div>
                                        </div>
                                        <div className="p-4 bg-orange-50 rounded-2xl border border-orange-200/60 mt-2">
                                            <div className="text-[11px] text-orange-600 font-bold uppercase">Monthly EMI</div>
                                            <div className="text-2xl font-bold font-mono text-slate-900 mt-1">
                                                {(() => {
                                                    const p = parseFloat(loanPrincipal) || 0;
                                                    const r = (parseFloat(loanInterest) || 0) / 12 / 100;
                                                    const n = (parseFloat(loanYears) || 0) * 12;
                                                    if (!p || !r || !n) return '₹0.00';
                                                    return formatINR((p * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1));
                                                })()}
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {finTab === 'sip' && (
                                    <div className="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm space-y-3">
                                        <label className="text-xs text-slate-500 font-medium">Monthly SIP (₹)</label>
                                        <input type="number" value={invMonthly} onChange={e => setInvMonthly(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-2xl p-2.5 text-sm font-mono text-slate-900" />
                                        <div className="grid grid-cols-2 gap-2">
                                            <input type="number" placeholder="Return %" value={invAnnual} onChange={e => setInvAnnual(e.target.value)} className="bg-slate-50 border border-slate-200 rounded-2xl p-2.5 text-sm font-mono text-slate-900" />
                                            <input type="number" placeholder="Years" value={invYears} onChange={e => setInvYears(e.target.value)} className="bg-slate-50 border border-slate-200 rounded-2xl p-2.5 text-sm font-mono text-slate-900" />
                                        </div>
                                        <div className="p-4 bg-orange-50 rounded-2xl border border-orange-200 mt-2">
                                            <div className="text-[11px] text-orange-600 font-bold uppercase">Estimated Corpus</div>
                                            <div className="text-2xl font-bold font-mono text-slate-900 mt-1">
                                                {(() => {
                                                    const pmt = parseFloat(invMonthly) || 0;
                                                    const r = (parseFloat(invAnnual) || 0) / 100 / 12;
                                                    const n = (parseFloat(invYears) || 0) * 12;
                                                    if (!n) return '₹0.00';
                                                    return formatINR(r > 0 ? pmt * ((Math.pow(1 + r, n) - 1) / r) : pmt * n);
                                                })()}
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {finTab === 'gst' && (
                                    <div className="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm space-y-3">
                                        <label className="text-xs text-slate-500 font-medium">Base Amount (₹)</label>
                                        <input type="number" value={gstBase} onChange={e => setGstBase(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-2xl p-2.5 text-sm font-mono text-slate-900" />
                                        <div className="flex space-x-2">
                                            {['5', '12', '18', '28'].map(rate => (
                                                <button key={rate} onClick={() => setGstRate(rate)} className={`flex-1 py-1.5 rounded-full text-xs font-semibold ${gstRate === rate ? 'bg-orange-500 text-white' : 'bg-slate-100 text-slate-700'}`}>{rate}%</button>
                                            ))}
                                        </div>
                                        <div className="p-4 bg-orange-50 rounded-2xl border border-orange-200 mt-2">
                                            <div className="text-xs text-slate-500">GST: <strong>{formatINR((parseFloat(gstBase) * parseFloat(gstRate)) / 100)}</strong></div>
                                            <div className="text-lg font-bold font-mono text-slate-900 mt-1">Total: {formatINR(parseFloat(gstBase) * (1 + parseFloat(gstRate) / 100))}</div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* 4. HEALTH */}
                        {activeTab === 'health' && (
                            <div className="space-y-4 pt-4">
                                <div className="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm space-y-3">
                                    <div className="grid grid-cols-2 gap-2.5">
                                        <div>
                                            <label className="text-xs text-slate-500 font-medium">Height (cm)</label>
                                            <input type="number" value={userHeight} onChange={e => setUserHeight(e.target.value)} className="w-full mt-1 bg-slate-50 border border-slate-200 rounded-2xl p-2.5 text-sm font-mono text-slate-900" />
                                        </div>
                                        <div>
                                            <label className="text-xs text-slate-500 font-medium">Weight (kg)</label>
                                            <input type="number" value={userWeight} onChange={e => setUserWeight(e.target.value)} className="w-full mt-1 bg-slate-50 border border-slate-200 rounded-2xl p-2.5 text-sm font-mono text-slate-900" />
                                        </div>
                                    </div>
                                </div>
                                {health && (
                                    <div className="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm flex items-center justify-between">
                                        <div>
                                            <div className="text-xs text-slate-400 font-medium">Body Mass Index (BMI)</div>
                                            <div className="text-3xl font-extrabold font-mono text-slate-900 mt-0.5">{health.bmi}</div>
                                            <div className={`text-xs font-semibold mt-1 ${health.col}`}>{health.cat}</div>
                                        </div>
                                        <div className="text-right">
                                            <div className="text-[11px] text-slate-400">Daily BMR: <strong className="text-slate-800">{health.bmr} kcal</strong></div>
                                            <div className="text-[11px] text-slate-400 mt-1">Water Goal: <strong className="text-orange-500">{health.water} L</strong></div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* 5. AGE */}
                        {activeTab === 'date' && (
                            <div className="space-y-4 pt-4">
                                <div className="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm space-y-3">
                                    <label className="text-xs text-slate-500 font-medium">Date of Birth</label>
                                    <input type="date" value={dob} onChange={e => setDob(e.target.value)} className="w-full bg-slate-50 border border-slate-200 rounded-2xl p-2.5 text-sm text-slate-800" />
                                </div>
                                {age && (
                                    <div className="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm text-center">
                                        <div className="text-xs font-semibold text-slate-400 uppercase tracking-widest">Exact Age</div>
                                        <div className="text-2xl font-bold text-slate-900 mt-1">{age.y} yrs {age.m} mos {age.d} days</div>
                                        <div className="text-xs text-orange-500 font-medium mt-1">{age.daysToBday} days to next birthday</div>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    {/* Bottom Nav */}
                    <nav className="fixed bottom-0 w-full max-w-md bg-white/95 backdrop-blur-md border-t border-slate-200 px-3 pt-2 pb-3 z-30 flex justify-between items-center">
                        {[
                            { id: 'calc', label: 'Calc', icon: 'calculator' },
                            { id: 'converter', label: 'Convert', icon: 'arrow-right-arrow-left' },
                            { id: 'finance', label: 'Finance', icon: 'indian-rupee-sign' },
                            { id: 'health', label: 'Health', icon: 'heart-pulse' },
                            { id: 'date', label: 'Age', icon: 'calendar-day' }
                        ].map(tab => (
                            <button
                                key={tab.id}
                                onClick={() => { triggerHaptic(); setActiveTab(tab.id); }}
                                className={`flex flex-col items-center justify-center py-1 px-3 rounded-full transition ${
                                    activeTab === tab.id ? 'text-[#ff9500] font-bold' : 'text-slate-400 hover:text-slate-600'
                                }`}
                            >
                                <i className={`fa-solid fa-${tab.icon} text-base mb-1`}></i>
                                <span className="text-[10px] tracking-tight">{tab.label}</span>
                            </button>
                        ))}
                    </nav>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
