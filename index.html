<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OmniCalc Pro - Vk Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; touch-action: manipulation; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const CONVERSION_RATES = {
            length: { m: 1, cm: 0.01, mm: 0.001, km: 1000, in: 0.0254, ft: 0.3048, yd: 0.9144, mi: 1609.344 },
            mass: { kg: 1, g: 0.001, mg: 0.000001, lb: 0.45359237, oz: 0.0283495, ton: 1000 },
            volume: { l: 1, ml: 0.001, gal: 3.78541, qt: 0.946353, cup: 0.24, floz: 0.0295735 },
            area: { sqm: 1, sqft: 0.092903, sqin: 0.00064516, acre: 4046.86, hectare: 10000 },
            temperature: { c: 'C', f: 'F', k: 'K' },
            speed: { mps: 1, kmh: 0.277778, mph: 0.44704, knot: 0.514444 },
            digital: { b: 1, kb: 1024, mb: 1048576, gb: 1073741824, tb: 1099511627776 }
        };

        function App() {
            const [activeTab, setActiveTab] = useState('calc');
            const [calcMode, setCalcMode] = useState('standard');
            const [display, setDisplay] = useState('0');
            const [expression, setExpression] = useState('');
            const [memory, setMemory] = useState(0);
            const [history, setHistory] = useState([]);
            const [showHistory, setShowHistory] = useState(false);
            const [isRad, setIsRad] = useState(false);

            const [convCat, setConvCat] = useState('length');
            const [convFrom, setConvFrom] = useState('m');
            const [convTo, setConvTo] = useState('ft');
            const [convVal, setConvVal] = useState('1');

            const [capturedImage, setCapturedImage] = useState(null);
            const [calibMode, setCalibMode] = useState('room_15ft'); 
            const [points, setPoints] = useState([]);
            const [measResult, setMeasResult] = useState(null);
            const [cameraActive, setCameraActive] = useState(false);

            const [finTab, setFinTab] = useState('loan');
            const [loanPrincipal, setLoanPrincipal] = useState('300000');
            const [loanInterest, setLoanInterest] = useState('6.5');
            const [loanYears, setLoanYears] = useState('20');
            const [tipBill, setTipBill] = useState('85');
            const [tipRate, setTipRate] = useState('18');
            const [tipSplit, setTipSplit] = useState('2');
            const [invInit, setInvInit] = useState('5000');
            const [invAnnual, setInvAnnual] = useState('8');
            const [invYears, setInvYears] = useState('10');
            const [invMonthly, setInvMonthly] = useState('200');

            const [dob, setDob] = useState('1998-04-12');
            const [cmpDate, setCmpDate] = useState(new Date().toISOString().split('T')[0]);

            const fileRef = useRef(null);
            const canvasRef = useRef(null);
            const videoRef = useRef(null);
            const reportRef = useRef(null);

            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (activeTab !== 'calc') return;
                    if ((e.key >= '0' && e.key <= '9') || e.key === '.') handleCalc(e.key);
                    else if (e.key === '+') handleCalc('+');
                    else if (e.key === '-') handleCalc('-');
                    else if (e.key === '*') handleCalc('×');
                    else if (e.key === '/') handleCalc('÷');
                    else if (e.key === 'Enter' || e.key === '=') handleCalc('=');
                    else if (e.key === 'Backspace') handleCalc('⌫');
                    else if (e.key === 'Escape') handleCalc('C');
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            });

            const handleCalc = (btn) => {
                if (btn === 'C') { setDisplay('0'); setExpression(''); }
                else if (btn === 'CE') { setDisplay('0'); }
                else if (btn === '⌫') { setDisplay(prev => (prev.length > 1 ? prev.slice(0, -1) : '0')); }
                else if (btn === '±') { setDisplay(prev => (prev.startsWith('-') ? prev.slice(1) : '-' + prev)); }
                else if (['+', '-', '×', '÷'].includes(btn)) {
                    setExpression(expression ? `${expression} ${display} ${btn}` : `${display} ${btn}`);
                    setDisplay('0');
                } else if (btn === '=') {
                    try {
                        let fullExp = (expression ? `${expression} ${display}` : display)
                            .replace(/×/g, '*').replace(/÷/g, '/').replace(/π/g, `${Math.PI}`).replace(/e/g, `${Math.E}`);
                        if (!/^[\d\s+\-*/.()MathPIE]+$/.test(fullExp)) throw new Error('Invalid');
                        const calcRes = Function(`"use strict"; return (${fullExp})`)();
                        const sanitized = Number.isFinite(calcRes) ? parseFloat(calcRes.toFixed(8)).toString() : 'Error';
                        setHistory(prev => [{ exp: `${expression} ${display}`, res: sanitized }, ...prev.slice(0, 19)]);
                        setDisplay(sanitized);
                        setExpression('');
                    } catch { setDisplay('Error'); }
                } else {
                    if (display === '0' && btn !== '.') setDisplay(btn);
                    else if (btn === '.' && display.includes('.')) return;
                    else setDisplay(prev => prev + btn);
                }
            };

            const handleScientific = (op) => {
                try {
                    let v = parseFloat(display);
                    let res = 0;
                    if (op === 'sin') res = Math.sin(isRad ? v : (v * Math.PI) / 180);
                    if (op === 'cos') res = Math.cos(isRad ? v : (v * Math.PI) / 180);
                    if (op === 'tan') res = Math.tan(isRad ? v : (v * Math.PI) / 180);
                    if (op === 'log') res = Math.log10(v);
                    if (op === 'ln') res = Math.log(v);
                    if (op === 'sqrt') res = Math.sqrt(v);
                    if (op === 'sqr') res = Math.pow(v, 2);
                    if (op === 'cube') res = Math.pow(v, 3);
                    if (op === 'inv') res = 1 / v;
                    if (op === 'fact') {
                        if (v < 0 || v > 150) throw new Error('Range');
                        let f = 1;
                        for (let i = 2; i <= Math.floor(v); i++) f *= i;
                        res = f;
                    }
                    const finalRes = parseFloat(res.toFixed(8)).toString();
                    setHistory(prev => [{ exp: `${op}(${display})`, res: finalRes }, ...prev.slice(0, 19)]);
                    setDisplay(finalRes);
                } catch { setDisplay('Error'); }
            };

            const handleMemory = (action) => {
                const current = parseFloat(display) || 0;
                if (action === 'MC') setMemory(0);
                if (action === 'MR') setDisplay(memory.toString());
                if (action === 'M+') setMemory(prev => prev + current);
                if (action === 'M-') setMemory(prev => prev - current);
            };

            useEffect(() => {
                const units = Object.keys(CONVERSION_RATES[convCat]);
                setConvFrom(units[0]);
                setConvTo(units[1] || units[0]);
            }, [convCat]);

            const runConversion = () => {
                const val = parseFloat(convVal);
                if (isNaN(val)) return '0';
                if (convCat === 'temperature') {
                    if (convFrom === convTo) return val;
                    let c = val;
                    if (convFrom === 'f') c = (val - 32) * (5 / 9);
                    if (convFrom === 'k') c = val - 273.15;
                    let target = c;
                    if (convTo === 'f') target = (c * 9) / 5 + 32;
                    if (convTo === 'k') target = c + 273.15;
                    return parseFloat(target.toFixed(4));
                }
                const catMap = CONVERSION_RATES[convCat];
                if (!catMap) return '0';
                return parseFloat(((val * catMap[convFrom]) / catMap[convTo]).toFixed(6));
            };

            const startCamera = async () => {
                try {
                    setCapturedImage(null); setPoints([]); setMeasResult(null); setCameraActive(true);
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } } });
                    if (videoRef.current) videoRef.current.srcObject = stream;
                } catch { alert('Camera unavailable'); setCameraActive(false); }
            };

            const takeSnapshot = () => {
                if (!videoRef.current) return;
                const vid = videoRef.current;
                const canvas = document.createElement('canvas');
                canvas.width = vid.videoWidth || 1280;
                canvas.height = vid.videoHeight || 720;
                canvas.getContext('2d').drawImage(vid, 0, 0, canvas.width, canvas.height);
                setCapturedImage(canvas.toDataURL('image/jpeg'));
                if (vid.srcObject) vid.srcObject.getTracks().forEach(t => t.stop());
                setCameraActive(false);
            };

            const handleFileImage = (e) => {
                const f = e.target.files[0];
                if (f) {
                    const reader = new FileReader();
                    reader.onload = ev => { setCapturedImage(ev.target.result); setPoints([]); setMeasResult(null); setCameraActive(false); };
                    reader.readAsDataURL(f);
                }
            };

            useEffect(() => {
                if (!capturedImage || !canvasRef.current) return;
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                const img = new Image();
                img.onload = () => {
                    canvas.width = img.width; canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);
                    if (points.length === 2) {
                        ctx.beginPath(); ctx.moveTo(points[0].x, points[0].y); ctx.lineTo(points[1].x, points[1].y);
                        ctx.strokeStyle = '#6366f1'; ctx.lineWidth = Math.max(4, canvas.width / 150); ctx.stroke();
                    }
                    points.forEach((pt, i) => {
                        ctx.fillStyle = i === 0 ? '#10b981' : '#f43f5e';
                        ctx.beginPath(); ctx.arc(pt.x, pt.y, Math.max(8, canvas.width / 80), 0, Math.PI * 2); ctx.fill();
                        ctx.strokeStyle = '#ffffff'; ctx.lineWidth = Math.max(2, canvas.width / 240); ctx.stroke();
                    });
                };
                img.src = capturedImage;
            }, [capturedImage, points]);

            const onCanvasClick = (e) => {
                if (!capturedImage) return;
                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                const sx = canvas.width / rect.width;
                const sy = canvas.height / rect.height;
                const x = (e.clientX - rect.left) * sx;
                const y = (e.clientY - rect.top) * sy;
                let next = [...points, { x, y }];
                if (next.length > 2) next = [{ x, y }];
                setPoints(next);
                if (next.length === 2) {
                    const pixelDist = Math.hypot(next[1].x - next[0].x, next[1].y - next[0].y);
                    const scopes = { card_3in: 0.28, desk_4ft: 4.0, room_15ft: 15.0, room_20ft: 20.0, field_60ft: 60.0 };
                    const feetPerPixel = (scopes[calibMode] || 15.0) / Math.hypot(canvas.width, canvas.height);
                    const lenFt = pixelDist * feetPerPixel;
                    const lenM = lenFt * 0.3048;
                    const estAreaSqFt = lenFt * (lenFt * 0.7);
                    setMeasResult({ ft: lenFt.toFixed(2), in: (lenFt * 12).toFixed(1), m: lenM.toFixed(2), cm: (lenM * 100).toFixed(1), sqFt: estAreaSqFt.toFixed(2), sqM: (estAreaSqFt * 0.092903).toFixed(2) });
                }
            };

            const calculateAge = () => {
                const start = new Date(dob);
                const end = new Date(cmpDate);
                if (isNaN(start) || isNaN(end) || end < start) return null;
                let y = end.getFullYear() - start.getFullYear();
                let m = end.getMonth() - start.getMonth();
                let d = end.getDate() - start.getDate();
                if (d < 0) { m--; d += new Date(end.getFullYear(), end.getMonth(), 0).getDate(); }
                if (m < 0) { y--; m += 12; }
                const totalDays = Math.floor((end - start) / (1000 * 60 * 60 * 24));
                let nextBday = new Date(end.getFullYear(), start.getMonth(), start.getDate());
                if (nextBday < end) nextBday = new Date(end.getFullYear() + 1, start.getMonth(), start.getDate());
                return { y, m, d, totalDays, totalWeeks: Math.floor(totalDays / 7), totalHours: totalDays * 24, daysToBday: Math.ceil((nextBday - end) / (1000 * 60 * 60 * 24)) };
            };
            const age = calculateAge();

            return (
                <div className="flex flex-col h-screen max-w-md mx-auto bg-slate-900 text-slate-100 shadow-2xl overflow-hidden border-x border-slate-800">
                    <header className="flex items-center justify-between px-4 py-3 bg-slate-900/95 backdrop-blur border-b border-slate-800 z-10 shrink-0">
                        <div className="flex items-center space-x-2.5">
                            <div className="w-8 h-8 rounded-xl bg-gradient-to-tr from-indigo-600 to-indigo-400 flex items-center justify-center font-bold text-white shadow-lg">
                                <i className="fa-solid fa-calculator text-sm"></i>
                            </div>
                            <div>
                                <h1 className="font-bold text-base bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">OmniCalc Pro</h1>
                                <span className="text-[10px] text-indigo-400 font-semibold block leading-none">Vk Edition</span>
                            </div>
                        </div>
                        <button onClick={() => setShowHistory(!showHistory)} className="p-2 rounded-xl bg-slate-800 text-slate-400 hover:text-white text-xs">
                            <i className="fa-solid fa-clock-rotate-left"></i>
                        </button>
                    </header>

                    <main className="flex-1 overflow-y-auto no-scrollbar p-4 pb-24">
                        {activeTab === 'calc' && (
                            <div className="flex flex-col h-full justify-between space-y-3">
                                <div className="flex justify-between items-center">
                                    <div className="flex space-x-1 bg-slate-950 p-1 rounded-xl text-xs border border-slate-800">
                                        <button onClick={() => setCalcMode('standard')} className={`px-3 py-1.5 rounded-lg transition ${calcMode === 'standard' ? 'bg-indigo-600 text-white' : 'text-slate-400'}`}>Standard</button>
                                        <button onClick={() => setCalcMode('scientific')} className={`px-3 py-1.5 rounded-lg transition ${calcMode === 'scientific' ? 'bg-indigo-600 text-white' : 'text-slate-400'}`}>Scientific</button>
                                    </div>
                                    {calcMode === 'scientific' && (
                                        <button onClick={() => setIsRad(!isRad)} className="text-xs px-2.5 py-1 rounded-lg bg-slate-800 text-indigo-400 font-mono font-semibold">{isRad ? 'RAD' : 'DEG'}</button>
                                    )}
                                </div>
                                <div className="bg-slate-950 p-4 rounded-2xl border border-slate-800 text-right min-h-[105px] flex flex-col justify-end">
                                    <div className="text-xs text-slate-500 font-mono">{expression || '\u00A0'}</div>
                                    <div className="text-3xl font-mono font-bold text-white mt-1">{display}</div>
                                </div>
                                <div className="grid grid-cols-4 gap-1.5 text-xs font-mono font-semibold">
                                    {['MC', 'MR', 'M+', 'M-'].map(m => (
                                        <button key={m} onClick={() => handleMemory(m)} className="py-1.5 bg-slate-800/50 hover:bg-slate-800 text-slate-400 rounded-lg">{m}</button>
                                    ))}
                                </div>
                                {showHistory && (
                                    <div className="bg-slate-950 p-3 rounded-2xl border border-slate-800 max-h-40 overflow-y-auto text-xs font-mono">
                                        <div className="flex justify-between pb-1 border-b border-slate-800 text-slate-400">
                                            <span>History</span>
                                            <button onClick={() => setHistory([])} className="text-rose-400">Clear</button>
                                        </div>
                                        {history.map((h, i) => (
                                            <div key={i} className="flex justify-between py-1 text-slate-300">
                                                <span className="text-slate-500">{h.exp} =</span>
                                                <span className="text-indigo-400 font-bold">{h.res}</span>
                                            </div>
                                        ))}
                                    </div>
                                )}
                                {calcMode === 'scientific' && (
                                    <div className="grid grid-cols-5 gap-1.5">
                                        {[
                                            { label: 'sin', act: () => handleScientific('sin') }, { label: 'cos', act: () => handleScientific('cos') }, { label: 'tan', act: () => handleScientific('tan') },
                                            { label: 'log', act: () => handleScientific('log') }, { label: 'ln', act: () => handleScientific('ln') }, { label: '√', act: () => handleScientific('sqrt') },
                                            { label: 'x²', act: () => handleScientific('sqr') }, { label: 'x³', act: () => handleScientific('cube') }, { label: '1/x', act: () => handleScientific('inv') },
                                            { label: 'n!', act: () => handleScientific('fact') }, { label: 'π', act: () => handleCalc('π') }, { label: 'e', act: () => handleCalc('e') },
                                            { label: '(', act: () => handleCalc('(') }, { label: ')', act: () => handleCalc(')') }, { label: '±', act: () => handleCalc('±') }
                                        ].map((b, i) => (
                                            <button key={i} onClick={b.act} className="p-2.5 bg-slate-800/80 text-xs rounded-xl font-medium text-indigo-300 active:scale-95">{b.label}</button>
                                        ))}
                                    </div>
                                )}
                                <div className="grid grid-cols-4 gap-2">
                                    <button onClick={() => handleCalc('C')} className="p-3.5 bg-rose-500/10 text-rose-400 font-bold rounded-2xl active:scale-95">C</button>
                                    <button onClick={() => handleCalc('CE')} className="p-3.5 bg-slate-800 text-slate-300 font-bold rounded-2xl active:scale-95">CE</button>
                                    <button onClick={() => handleCalc('⌫')} className="p-3.5 bg-slate-800 text-slate-300 font-bold rounded-2xl active:scale-95"><i className="fa-solid fa-delete-left"></i></button>
                                    <button onClick={() => handleCalc('÷')} className="p-3.5 bg-indigo-600/20 text-indigo-400 font-bold text-lg rounded-2xl active:scale-95">÷</button>
                                    <button onClick={() => handleCalc('7')} className="p-3.5 bg-slate-800/60 text-white font-bold text-lg rounded-2xl active:scale-95">7</button>
                                    <button onClick={() => handleCalc('8')} className="p-3.5 bg-slate-800/60 text-white font-bold text-lg rounded-2xl active:scale-95">8</button>
                                    <button onClick={() => handleCalc('9')} className="p-3.5 bg-slate-800/60 text-white font-bold text-lg rounded-2xl active:scale-95">9</button>
                                    <button onClick={() => handleCalc('×')} className="p-3.5 bg-indigo-600/20 text-indigo-400 font-bold text-lg rounded-2xl active:scale-95">×</button>
                                    <button onClick={() => handleCalc('4')} className="p-3.5 bg-slate-800/60 text-white font-bold text-lg rounded-2xl active:scale-95">4</button>
                                    <button onClick={() => handleCalc('5')} className="p-3.5 bg-slate-800/60 text-white font-bold text-lg rounded-2xl active:scale-95">5</button>
                                    <button onClick={() => handleCalc('6')} className="p-3.5 bg-slate-800/60 text-white font-bold text-lg rounded-2xl active:scale-95">6</button>
                                    <button onClick={() => handleCalc('-')} className="p-3.5 bg-indigo-600/20 text-indigo-400 font-bold text-lg rounded-2xl active:scale-95">-</button>
                                    <button onClick={() => handleCalc('1')} className="p-3.5 bg-slate-800/60 text-white font-bold text-lg rounded-2xl active:scale-95">1</button>
                                    <button onClick={() => handleCalc('2')} className="p-3.5 bg-slate-800/60 text-white font-bold text-lg rounded-2xl active:scale-95">2</button>
                                    <button onClick={() => handleCalc('3')} className="p-3.5 bg-slate-800/60 text-white font-bold text-lg rounded-2xl active:scale-95">3</button>
                                    <button onClick={() => handleCalc('+')} className="p-3.5 bg-indigo-600/20 text-indigo-400 font-bold text-lg rounded-2xl active:scale-95">+</button>
                                    <button onClick={() => handleCalc('0')} className="p-3.5 col-span-2 bg-slate-800/60 text-white font-bold text-lg rounded-2xl active:scale-95">0</button>
                                    <button onClick={() => handleCalc('.')} className="p-3.5 bg-slate-800/60 text-white font-bold text-lg rounded-2xl active:scale-95">.</button>
                                    <button onClick={() => handleCalc('=')} className="p-3.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xl rounded-2xl active:scale-95 shadow-lg shadow-indigo-600/30">=</button>
                                </div>
                            </div>
                        )}

                        {activeTab === 'converter' && (
                            <div className="space-y-4">
                                <div className="flex overflow-x-auto space-x-2 py-1 no-scrollbar">
                                    {[
                                        { id: 'length', name: 'Length', icon: 'ruler' }, { id: 'mass', name: 'Mass', icon: 'weight-scale' },
                                        { id: 'volume', name: 'Volume', icon: 'glass-water' }, { id: 'area', name: 'Area', icon: 'chart-area' },
                                        { id: 'temperature', name: 'Temp', icon: 'temperature-high' }, { id: 'speed', name: 'Speed', icon: 'gauge-high' },
                                        { id: 'digital', name: 'Data', icon: 'hard-drive' }
                                    ].map(cat => (
                                        <button key={cat.id} onClick={() => setConvCat(cat.id)} className={`px-3 py-2 rounded-xl text-xs font-semibold whitespace-nowrap flex items-center space-x-1.5 ${convCat === cat.id ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-400'}`}>
                                            <i className={`fa-solid fa-${cat.icon}`}></i><span>{cat.name}</span>
                                        </button>
                                    ))}
                                </div>
                                <div className="bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-4">
                                    <div>
                                        <label className="text-xs text-slate-400 font-medium">Input Value</label>
                                        <input type="number" value={convVal} onChange={e => setConvVal(e.target.value)} className="w-full mt-1.5 bg-slate-900 border border-slate-800 rounded-xl p-3 text-lg font-mono text-white focus:outline-none" />
                                    </div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <select value={convFrom} onChange={e => setConvFrom(e.target.value)} className="bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-sm text-indigo-300 uppercase">
                                            {Object.keys(CONVERSION_RATES[convCat]).map(u => <option key={u} value={u}>{u.toUpperCase()}</option>)}
                                        </select>
                                        <select value={convTo} onChange={e => setConvTo(e.target.value)} className="bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-sm text-indigo-300 uppercase">
                                            {Object.keys(CONVERSION_RATES[convCat]).map(u => <option key={u} value={u}>{u.toUpperCase()}</option>)}
                                        </select>
                                    </div>
                                </div>
                                <div className="bg-gradient-to-br from-indigo-950/40 to-slate-900 p-5 rounded-2xl border border-indigo-800/40 text-center">
                                    <div className="text-xs font-semibold text-indigo-400 uppercase">Converted Result</div>
                                    <div className="text-3xl font-bold font-mono text-white mt-2">{runConversion()} <span className="text-sm font-sans text-indigo-400 uppercase">{convTo}</span></div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'measure' && (
                            <div className="space-y-4">
                                <div className="flex justify-between items-center">
                                    <h2 className="text-sm font-bold text-white">Photo / AR Ruler</h2>
                                    <select value={calibMode} onChange={e => setCalibMode(e.target.value)} className="text-xs bg-slate-800 border border-slate-700 rounded-lg px-2 py-1 text-indigo-300">
                                        <option value="card_3in">Standard Card (3.37 in)</option>
                                        <option value="desk_4ft">Desk Span (4 ft)</option>
                                        <option value="room_15ft">Bedroom (15 ft)</option>
                                        <option value="room_20ft">Living Room (20 ft)</option>
                                        <option value="field_60ft">Outdoor (60 ft)</option>
                                    </select>
                                </div>
                                <div className="relative w-full aspect-[4/3] bg-slate-950 rounded-2xl border border-slate-800 overflow-hidden flex items-center justify-center">
                                    {cameraActive ? (
                                        <div className="relative w-full h-full flex flex-col justify-end">
                                            <video ref={videoRef} autoPlay playsInline className="absolute inset-0 w-full h-full object-cover"></video>
                                            <div className="relative z-10 p-3 flex justify-center bg-gradient-to-t from-slate-950/80 to-transparent">
                                                <button onClick={takeSnapshot} className="w-12 h-12 rounded-full border-4 border-white bg-indigo-600 flex items-center justify-center"><i className="fa-solid fa-camera text-white"></i></button>
                                            </div>
                                        </div>
                                    ) : capturedImage ? (
                                        <canvas ref={canvasRef} onClick={onCanvasClick} className="w-full h-full object-contain cursor-crosshair" />
                                    ) : (
                                        <div className="text-center p-6 space-y-3">
                                            <i className="fa-solid fa-camera text-2xl text-indigo-400"></i>
                                            <div className="text-xs text-slate-400">Capture or upload an image to measure dimensions</div>
                                            <div className="flex justify-center space-x-2">
                                                <button onClick={startCamera} className="px-3 py-1.5 bg-indigo-600 text-white rounded-xl text-xs">Open Cam</button>
                                                <button onClick={() => fileRef.current.click()} className="px-3 py-1.5 bg-slate-800 text-slate-300 rounded-xl text-xs">Upload File</button>
                                            </div>
                                        </div>
                                    )}
                                    <input type="file" ref={fileRef} onChange={handleFileImage} accept="image/*" className="hidden" />
                                </div>
                                {measResult && (
                                    <div className="bg-slate-950 p-4 rounded-2xl border border-slate-800 grid grid-cols-2 gap-2.5">
                                        <div className="bg-slate-900 p-2.5 rounded-xl"><div className="text-[10px] text-slate-400">Length (Imperial)</div><div className="text-base font-bold font-mono text-white">{measResult.ft} ft ({measResult.in}")</div></div>
                                        <div className="bg-slate-900 p-2.5 rounded-xl"><div className="text-[10px] text-slate-400">Length (Metric)</div><div className="text-base font-bold font-mono text-white">{measResult.m} m ({measResult.cm} cm)</div></div>
                                        <div className="bg-slate-900 p-2.5 rounded-xl"><div className="text-[10px] text-slate-400">Est. Area (Imperial)</div><div className="text-base font-bold font-mono text-indigo-300">{measResult.sqFt} sq ft</div></div>
                                        <div className="bg-slate-900 p-2.5 rounded-xl"><div className="text-[10px] text-slate-400">Est. Area (Metric)</div><div className="text-base font-bold font-mono text-indigo-300">{measResult.sqM} m²</div></div>
                                    </div>
                                )}
                            </div>
                        )}

                        {activeTab === 'finance' && (
                            <div className="space-y-4">
                                <div className="grid grid-cols-3 gap-1 bg-slate-950 p-1 rounded-xl text-xs border border-slate-800">
                                    <button onClick={() => setFinTab('loan')} className={`py-1.5 rounded-lg ${finTab === 'loan' ? 'bg-indigo-600 text-white' : 'text-slate-400'}`}>Loan EMI</button>
                                    <button onClick={() => setFinTab('compound')} className={`py-1.5 rounded-lg ${finTab === 'compound' ? 'bg-indigo-600 text-white' : 'text-slate-400'}`}>Growth</button>
                                    <button onClick={() => setFinTab('tip')} className={`py-1.5 rounded-lg ${finTab === 'tip' ? 'bg-indigo-600 text-white' : 'text-slate-400'}`}>Tip Split</button>
                                </div>
                                {finTab === 'loan' && (
                                    <div className="bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-3">
                                        <input type="number" placeholder="Principal ($)" value={loanPrincipal} onChange={e => setLoanPrincipal(e.target.value)} className="w-full bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-sm font-mono text-white" />
                                        <div className="grid grid-cols-2 gap-2">
                                            <input type="number" step="0.1" placeholder="Interest (%)" value={loanInterest} onChange={e => setLoanInterest(e.target.value)} className="bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-sm font-mono text-white" />
                                            <input type="number" placeholder="Tenure (Years)" value={loanYears} onChange={e => setLoanYears(e.target.value)} className="bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-sm font-mono text-white" />
                                        </div>
                                        <div className="p-4 bg-indigo-950/40 border border-indigo-900/60 rounded-xl">
                                            <div className="text-xs text-indigo-300 uppercase">Monthly EMI</div>
                                            <div className="text-2xl font-bold font-mono text-white mt-1">
                                                ${(() => {
                                                    const p = parseFloat(loanPrincipal) || 0;
                                                    const r = (parseFloat(loanInterest) || 0) / 12 / 100;
                                                    const n = (parseFloat(loanYears) || 0) * 12;
                                                    if (!p || !r || !n) return '0.00';
                                                    return ((p * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1)).toFixed(2);
                                                })()}
                                            </div>
                                        </div>
                                    </div>
                                )}
                                {finTab === 'compound' && (
                                    <div className="bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-3">
                                        <input type="number" placeholder="Initial ($)" value={invInit} onChange={e => setInvInit(e.target.value)} className="w-full bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-sm font-mono text-white" />
                                        <div className="grid grid-cols-2 gap-2">
                                            <input type="number" placeholder="Monthly Add ($)" value={invMonthly} onChange={e => setInvMonthly(e.target.value)} className="bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-sm font-mono text-white" />
                                            <input type="number" placeholder="Growth (%)" value={invAnnual} onChange={e => setInvAnnual(e.target.value)} className="bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-sm font-mono text-white" />
                                        </div>
                                        <input type="number" placeholder="Years" value={invYears} onChange={e => setInvYears(e.target.value)} className="w-full bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-sm font-mono text-white" />
                                        <div className="p-4 bg-indigo-950/40 border border-indigo-900/60 rounded-xl">
                                            <div className="text-xs text-indigo-300 uppercase">Future Portfolio Value</div>
                                            <div className="text-2xl font-bold font-mono text-white mt-1">
                                                ${(() => {
                                                    const p = parseFloat(invInit) || 0;
                                                    const pmt = parseFloat(invMonthly) || 0;
                                                    const r = (parseFloat(invAnnual) || 0) / 100 / 12;
                                                    const n = (parseFloat(invYears) || 0) * 12;
                                                    if (!n) return p.toFixed(2);
                                                    return (p * Math.pow(1 + r, n) + (r > 0 ? pmt * ((Math.pow(1 + r, n) - 1) / r) : pmt * n)).toFixed(2);
                                                })()}
                                            </div>
                                        </div>
                                    </div>
                                )}
                                {finTab === 'tip' && (
                                    <div className="bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-3">
                                        <input type="number" placeholder="Bill ($)" value={tipBill} onChange={e => setTipBill(e.target.value)} className="w-full bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-sm font-mono text-white" />
                                        <div className="flex space-x-2">
                                            {['10', '15', '18', '20', '25'].map(p => (
                                                <button key={p} onClick={() => setTipRate(p)} className={`flex-1 py-1.5 rounded-lg text-xs font-semibold ${tipRate === p ? 'bg-indigo-600 text-white' : 'bg-slate-900 text-slate-400'}`}>{p}%</button>
                                            ))}
                                        </div>
                                        <input type="number" min="1" placeholder="Split Count" value={tipSplit} onChange={e => setTipSplit(e.target.value)} className="w-full bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-sm font-mono text-white" />
                                        <div className="p-3 bg-indigo-950/30 rounded-xl border border-indigo-900/50 flex justify-between">
                                            <div><div className="text-[11px] text-indigo-300">Total Tip</div><div className="text-lg font-bold font-mono text-white">${(((parseFloat(tipBill) || 0) * (parseFloat(tipRate) || 0)) / 100).toFixed(2)}</div></div>
                                            <div className="text-right"><div className="text-[11px] text-indigo-300">Per Person</div><div className="text-lg font-bold font-mono text-white">${(((parseFloat(tipBill) || 0) * (1 + (parseFloat(tipRate) || 0) / 100)) / Math.max(1, parseInt(tipSplit) || 1)).toFixed(2)}</div></div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {activeTab === 'date' && (
                            <div className="space-y-4">
                                <div className="bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-3">
                                    <input type="date" value={dob} onChange={e => setDob(e.target.value)} className="w-full bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-sm text-white" />
                                    <input type="date" value={cmpDate} onChange={e => setCmpDate(e.target.value)} className="w-full bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-sm text-white" />
                                </div>
                                {age && (
                                    <div className="space-y-3">
                                        <div className="bg-gradient-to-br from-indigo-950/50 to-slate-950 p-4 rounded-2xl border border-indigo-800/40">
                                            <div className="text-xs font-semibold text-indigo-300 uppercase">Exact Chronological Age</div>
                                            <div className="text-2xl font-bold text-white mt-1">{age.y} yrs {age.m} mos {age.d} days</div>
                                        </div>
                                        <div className="grid grid-cols-3 gap-2 text-center">
                                            <div className="bg-slate-950 p-3 rounded-xl border border-slate-800"><div className="text-[10px] text-slate-400">Weeks</div><div className="text-base font-bold font-mono text-white">{age.totalWeeks.toLocaleString()}</div></div>
                                            <div className="bg-slate-950 p-3 rounded-xl border border-slate-800"><div className="text-[10px] text-slate-400">Total Days</div><div className="text-base font-bold font-mono text-white">{age.totalDays.toLocaleString()}</div></div>
                                            <div className="bg-slate-950 p-3 rounded-xl border border-slate-800"><div className="text-[10px] text-slate-400">Next B'day</div><div className="text-base font-bold font-mono text-white">{age.daysToBday}d</div></div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    <nav className="fixed bottom-0 w-full max-w-md bg-slate-950/95 backdrop-blur border-t border-slate-800 px-3 py-2 z-20 flex justify-between items-center">
                        {[
                            { id: 'calc', label: 'Calc', icon: 'calculator' },
                            { id: 'converter', label: 'Convert', icon: 'arrow-right-arrow-left' },
                            { id: 'measure', label: 'Measure', icon: 'ruler-combined' },
                            { id: 'finance', label: 'Finance', icon: 'coins' },
                            { id: 'date', label: 'Age', icon: 'calendar-day' }
                        ].map(tab => (
                            <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`flex flex-col items-center justify-center py-1 px-3 rounded-xl transition ${activeTab === tab.id ? 'text-indigo-400 font-semibold' : 'text-slate-500 hover:text-slate-300'}`}>
                                <i className={`fa-solid fa-${tab.icon} text-base mb-1`}></i>
                                <span className="text-[10px]">{tab.label}</span>
                            </button>
                        ))}
                    </nav>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
